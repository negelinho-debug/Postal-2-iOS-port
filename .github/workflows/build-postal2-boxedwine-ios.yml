name: POSTAL 2 BoxedWine iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BoxedWine iPhone Runtime
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install xcodegen

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

      # ==========================================================
      # BOXEDWINE
      # ==========================================================

      - name: Clone BoxedWine
        run: |
          set -e

          rm -rf Boxedwine

          git clone \
            --depth 1 \
            https://github.com/danoon2/Boxedwine.git \
            Boxedwine

          cd Boxedwine

          echo "===== BOXEDWINE COMMIT ====="
          git rev-parse HEAD

          test -d source
          test -d platform/sdl
          test -f source/sdl/main.cpp
          test -f source/opengl/sdl/sdlgl.cpp
          test -f source/opengl/es/esopengl.c
          test -f source/opengl/es/esopengl.h

      # ==========================================================
      # FIX BHASHTABLE
      # ==========================================================

      - name: Patch BHashTable
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("Boxedwine/source/util/bhashtable.h")

          if not p.exists():
              raise SystemExit("bhashtable.h not found")

          s = p.read_text()

          if "using const_iterator::owner;" not in s:
              marker = "struct iterator : public const_iterator {"

              if marker not in s:
                  raise SystemExit(
                      "BHashTable iterator block not found"
                  )

              replacement = """struct iterator : public const_iterator {
              using const_iterator::owner;
              using const_iterator::slot_index;
          """

              s = s.replace(
                  marker,
                  replacement,
                  1
              )

              p.write_text(s)

          print("BHashTable patch OK")
          PY

          grep -n -A10 \
            "struct iterator : public const_iterator" \
            Boxedwine/source/util/bhashtable.h \
            | head -20

      # ==========================================================
      # SIMDE
      # ==========================================================

      - name: Clone stable SIMDe
        run: |
          set -e

          rm -rf SIMDe

          git clone \
            --depth 1 \
            --branch v0.8.2 \
            https://github.com/simd-everywhere/simde.git \
            SIMDe

          test -f SIMDe/simde/x86/sse.h
          test -f SIMDe/simde/x86/sse2.h

          echo "===== SIMDE ====="

          cd SIMDe
          git describe --tags --always
          cd ..

      # ==========================================================
      # FIX SIMDE XCODE 26
      # ==========================================================

      - name: Patch SIMDe SSE2
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("SIMDe/simde/x86/sse2.h")

          if not p.exists():
              raise SystemExit("sse2.h not found")

          text = p.read_text()

          start = text.find("simde_mm_cvtpd_ps")

          if start == -1:
              raise SystemExit(
                  "simde_mm_cvtpd_ps not found"
              )

          end = text.find(
              "#if defined(SIMDE_X86_SSE2_ENABLE_NATIVE_ALIASES)",
              start
          )

          if end == -1:
              raise SystemExit(
                  "end of simde_mm_cvtpd_ps not found"
              )

          block = text[start:end]

          broken = (
              "#elif HEDLEY_HAS_BUILTIN("
              "__builtin_shufflevector"
              ") && HEDLEY_HAS_BUILTIN("
              "__builtin_convertvector"
              ")"
          )

          fixed = (
              "#elif 0 "
              "/* iOS Xcode: force scalar fallback */"
          )

          if fixed in block:
              print("SIMDe patch already applied")

          elif broken in block:
              block = block.replace(
                  broken,
                  fixed,
                  1
              )

              text = (
                  text[:start]
                  + block
                  + text[end:]
              )

              p.write_text(text)

              print("SIMDe SSE2 patch OK")

          else:
              raise SystemExit(
                  "SIMDe shufflevector branch not found"
              )
          PY

      # ==========================================================
      # PATCH OPENGL FOR IOS
      # ==========================================================

      - name: Patch BoxedWine OpenGL for iOS
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "Boxedwine/source/opengl/sdl/sdlgl.cpp"
          )

          if not p.exists():
              raise SystemExit("sdlgl.cpp not found")

          s = p.read_text()

          # -----------------------------------------------
          # Use GLES2 headers on iOS.
          # -----------------------------------------------

          old_include = "#include <SDL_opengl.h>"

          new_include = """#ifdef BOXEDWINE_ES
          #include <SDL_opengles2.h>
          #else
          #include <SDL_opengl.h>
          #endif"""

          if old_include in s:
              s = s.replace(
                  old_include,
                  new_include,
                  1
              )

          # -----------------------------------------------
          # All original __APPLE__ paths in this file are
          # macOS/CGL-specific. They must not run on iOS.
          # -----------------------------------------------

          s = s.replace(
              "#ifdef __APPLE__",
              "#if defined(__APPLE__) && TARGET_OS_OSX"
          )

          # -----------------------------------------------
          # TargetConditionals is needed to tell macOS
          # apart from iOS.
          # -----------------------------------------------

          if "<TargetConditionals.h>" not in s:

              marker = '#include "boxedwine.h"\n'

              replacement = """#include "boxedwine.h"

          #ifdef __APPLE__
          #include <TargetConditionals.h>
          #endif
          """

              if marker not in s:
                  raise SystemExit(
                      "boxedwine include marker not found"
                  )

              s = s.replace(
                  marker,
                  replacement,
                  1
              )

          # -----------------------------------------------
          # Force an OpenGL ES context.
          # -----------------------------------------------

          reset = "    SDL_GL_ResetAttributes();"

          es_setup = """    SDL_GL_ResetAttributes();

          #ifdef BOXEDWINE_ES
              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_PROFILE_MASK,
                  SDL_GL_CONTEXT_PROFILE_ES
              );

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MAJOR_VERSION,
                  2
              );

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MINOR_VERSION,
                  0
              );
          #endif"""

          if (
              "SDL_GL_CONTEXT_PROFILE_ES"
              not in s
          ):
              if reset not in s:
                  raise SystemExit(
                      "SDL_GL_ResetAttributes not found"
                  )

              s = s.replace(
                  reset,
                  es_setup,
                  1
              )

          # -----------------------------------------------
          # Do not override ES profile with desktop CORE.
          # -----------------------------------------------

          desktop_core = """    if (major) {
                  if (major >= 3) {
                      SDL_GL_SetAttribute(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_CORE);
                  }
                  //#ifdef BOXEDWINE_MSVC
                  SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, major);
                  SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, minor);
                  //#endif
              }"""

          desktop_core_fixed = """#ifndef BOXEDWINE_ES
              if (major) {
                  if (major >= 3) {
                      SDL_GL_SetAttribute(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_CORE);
                  }
                  SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, major);
                  SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, minor);
              }
          #endif"""

          if desktop_core in s:
              s = s.replace(
                  desktop_core,
                  desktop_core_fixed,
                  1
              )

          p.write_text(s)

          print("sdlgl.cpp iOS patch OK")
          PY

          echo "===== SDLGL TOP ====="

          sed -n '18,55p' \
            Boxedwine/source/opengl/sdl/sdlgl.cpp

      # ==========================================================
      # FIX CURRENT ERROR:
      # GLdouble / GLclampd ARE NOT IN GLES2 HEADERS
      #
      # BoxedWine defines these inside esopengl.c, but
      # esopengl.h is also included from C++ translation units.
      # ==========================================================

      - name: Fix GLdouble and GLclampd
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "Boxedwine/source/opengl/es/esopengl.h"
          )

          if not p.exists():
              raise SystemExit(
                  "esopengl.h not found"
              )

          s = p.read_text()

          marker = (
              "/* BOXEDWINE_IOS_GLDOUBLE_FIX */"
          )

          if marker not in s:

              patch = """/* BOXEDWINE_IOS_GLDOUBLE_FIX */

          #ifndef GLdouble
          #define GLdouble double
          #endif

          #ifndef GLclampd
          #define GLclampd double
          #endif

          """

              p.write_text(
                  patch + s
              )

          print(
              "GLdouble and GLclampd patch OK"
          )
          PY

          echo "===== ES OPENGL HEADER ====="

          head -25 \
            Boxedwine/source/opengl/es/esopengl.h

      # ==========================================================
      # REMOVE DUPLICATE MAIN
      # IOSHost/main.mm owns main()
      # ==========================================================

      - name: Patch SDL platform main
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "Boxedwine/platform/sdl/knativesystem.cpp"
          )

          if not p.exists():
              raise SystemExit(
                  "knativesystem.cpp not found"
              )

          s = p.read_text()

          old = "#ifndef __TEST"

          new = (
              "#if !defined(__TEST) && "
              "!defined(BOXEDWINE_IOS_HOST)"
          )

          if new in s:
              print(
                  "main guard already patched"
              )

          elif old in s:
              s = s.replace(
                  old,
                  new,
                  1
              )

              p.write_text(s)

              print(
                  "duplicate main guard patched"
              )

          else:
              raise SystemExit(
                  "main guard not found"
              )
          PY

      # ==========================================================
      # SDL2
      # ==========================================================

      - name: Clone SDL2
        run: |
          set -e

          rm -rf SDL2

          git clone \
            --depth 1 \
            --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git \
            SDL2

          test -d SDL2/Xcode/SDL
          test -d SDL2/include

      - name: Build SDL2 for iPhone
        run: |
          set -e
          set -o pipefail

          cd SDL2

          rm -rf sdlbuild

          xcodebuild \
            -project Xcode/SDL/SDL.xcodeproj \
            -target "Static Library-iOS" \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/sdlbuild" \
            build \
            2>&1 | tee sdl-build.log

          SDL_LIB="$(
            find sdlbuild \
              -type f \
              -name 'libSDL2.a' \
              | head -1
          )"

          if [ -z "$SDL_LIB" ]; then

              echo "ERROR: libSDL2.a not found"

              exit 1

          fi

          mkdir -p \
            "$GITHUB_WORKSPACE/Vendor"

          cp \
            "$SDL_LIB" \
            "$GITHUB_WORKSPACE/Vendor/libSDL2.a"

          echo "===== SDL2 ====="

          file \
            "$GITHUB_WORKSPACE/Vendor/libSDL2.a"

          ls -lh \
            "$GITHUB_WORKSPACE/Vendor/libSDL2.a"

      # ==========================================================
      # MINIZIP
      # ==========================================================

      - name: Clone zlib
        run: |
          set -e

          rm -rf zlib-src

          git clone \
            --depth 1 \
            https://github.com/madler/zlib.git \
            zlib-src

          mkdir -p \
            Vendor/include/minizip

          cp \
            zlib-src/contrib/minizip/*.h \
            Vendor/include/minizip/

      - name: Build minizip
        run: |
          set -e

          SDK="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          CC="$(
            xcrun \
              --sdk iphoneos \
              -f clang
          )"

          rm -rf minizip-build

          mkdir -p minizip-build

          for SRC in \
            ioapi.c \
            unzip.c \
            zip.c \
            mztools.c
          do

              "$CC" \
                -c \
                -O3 \
                -arch arm64 \
                -isysroot "$SDK" \
                -miphoneos-version-min=15.0 \
                -Izlib-src \
                -Izlib-src/contrib/minizip \
                "zlib-src/contrib/minizip/$SRC" \
                -o \
                "minizip-build/${SRC%.c}.o"

          done

          /usr/bin/libtool \
            -static \
            -o Vendor/libminizip.a \
            minizip-build/*.o

          echo "===== MINIZIP ====="

          file \
            Vendor/libminizip.a

          ls -lh \
            Vendor/libminizip.a

      # ==========================================================
      # IPHONE LAUNCHER
      #
      # Expected later in Documents:
      #
      # Wine.zip
      #
      # postal2/
      #   System/
      #     Postal2.exe
      # ==========================================================

      - name: Create POSTAL 2 launcher
        run: |
          set -e

          mkdir -p IOSHost

          cat > IOSHost/main.mm <<'EOF'
          #import <Foundation/Foundation.h>

          #include <SDL.h>
          #include <unistd.h>
          #include <sys/stat.h>

          #include <string>
          #include <vector>

          extern int boxedmain(
              int argc,
              const char **argv
          );

          static bool fileExists(
              const std::string& path
          ) {
              struct stat st {};

              return stat(
                  path.c_str(),
                  &st
              ) == 0;
          }

          static void showMessage(
              const char* title,
              const char* text
          ) {
              SDL_Init(
                  SDL_INIT_VIDEO
              );

              SDL_ShowSimpleMessageBox(
                  SDL_MESSAGEBOX_INFORMATION,
                  title,
                  text,
                  nullptr
              );

              SDL_Quit();
          }

          int main(
              int argc,
              char* argv[]
          ) {
              @autoreleasepool {

                  NSArray *paths =
                      NSSearchPathForDirectoriesInDomains(
                          NSDocumentDirectory,
                          NSUserDomainMask,
                          YES
                      );

                  NSString *documents =
                      [paths firstObject];

                  if (!documents) {
                      return 1;
                  }

                  std::string docs(
                      [documents
                          fileSystemRepresentation]
                  );

                  chdir(
                      docs.c_str()
                  );

                  std::string wineZip =
                      docs + "/Wine.zip";

                  if (!fileExists(wineZip)) {

                      std::vector<std::string>
                          candidates = {

                          docs + "/Wine-5.0.zip",

                          docs + "/Wine-7.0.zip",

                          docs + "/Wine-9.0.zip",

                          docs + "/Wine-11.0.zip"
                      };

                      for (
                          const auto& candidate :
                          candidates
                      ) {

                          if (
                              fileExists(candidate)
                          ) {

                              wineZip =
                                  candidate;

                              break;
                          }
                      }
                  }

                  std::string game =
                      docs + "/postal2";

                  std::string exe =
                      game
                      + "/System/Postal2.exe";

                  if (!fileExists(wineZip)) {

                      showMessage(
                          "POSTAL 2",
                          "Нужен Wine.zip в папке приложения."
                      );

                      return 0;
                  }

                  if (!fileExists(exe)) {

                      showMessage(
                          "POSTAL 2",
                          "Положи папку postal2 в Documents приложения."
                      );

                      return 0;
                  }

                  std::string root =
                      docs + "/root";

                  mkdir(
                      root.c_str(),
                      0755
                  );

                  const char* glext =
                      "GL_EXT_multi_draw_arrays "
                      "GL_ARB_vertex_program "
                      "GL_ARB_fragment_program "
                      "GL_ARB_multitexture "
                      "GL_EXT_secondary_color "
                      "GL_EXT_texture_lod_bias "
                      "GL_NV_texture_env_combine4 "
                      "GL_ATI_texture_env_combine3 "
                      "GL_EXT_texture_filter_anisotropic "
                      "GL_ARB_texture_env_combine "
                      "GL_EXT_texture_env_combine "
                      "GL_EXT_texture_compression_s3tc "
                      "GL_ARB_texture_compression "
                      "GL_EXT_paletted_texture";

                  std::vector<std::string>
                      values = {

                      "BoxedWine",

                      "-root",
                      root,

                      "-zip",
                      wineZip,

                      "-mount_drive",
                      game,
                      "d",

                      "-fullscreen",

                      "-forceRelativeMouse",

                      "-resolution",
                      "960x540",

                      "-bpp",
                      "32",

                      "-vsync",
                      "1",

                      "-p3",

                      "-glext",
                      glext,

                      "-title",
                      "POSTAL 2",

                      "/bin/wine",

                      "d:\\System\\Postal2.exe"
                  };

                  std::vector<const char*>
                      args;

                  for (
                      auto& value :
                      values
                  ) {

                      args.push_back(
                          value.c_str()
                      );
                  }

                  return boxedmain(
                      (int)args.size(),
                      args.data()
                  );
              }
          }
          EOF

      # ==========================================================
      # INFO PLIST
      # ==========================================================

      - name: Create Info plist
        run: |
          set -e

          mkdir -p IOSHost

          cat > IOSHost/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>CFBundleDisplayName</key>
              <string>POSTAL 2</string>

              <key>CFBundleName</key>
              <string>POSTAL 2</string>

              <key>CFBundleIdentifier</key>
              <string>com.postal2.boxedwine</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>0.8</string>

              <key>CFBundleVersion</key>
              <string>8</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UIFileSharingEnabled</key>
              <true/>

              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>

              <key>UIRequiresFullScreen</key>
              <true/>

              <key>UISupportedInterfaceOrientations</key>

              <array>

                  <string>
                  UIInterfaceOrientationLandscapeLeft
                  </string>

                  <string>
                  UIInterfaceOrientationLandscapeRight
                  </string>

              </array>

              <key>
              UIApplicationSupportsIndirectInputEvents
              </key>

              <true/>

              <key>UILaunchScreen</key>

              <dict/>

          </dict>

          </plist>
          EOF

      # ==========================================================
      # XCODE PROJECT
      # ==========================================================

      - name: Create Xcode project
        run: |
          set -e

          cat > project.yml <<'EOF'
          name: Postal2BoxedWine

          options:

            bundleIdPrefix:
              com.postal2

            deploymentTarget:

              iOS:
                "15.0"

          settings:

            base:

              IPHONEOS_DEPLOYMENT_TARGET:
                "15.0"

              CLANG_CXX_LANGUAGE_STANDARD:
                gnu++20

              CLANG_CXX_LIBRARY:
                libc++

              GCC_C_LANGUAGE_STANDARD:
                gnu11

              ENABLE_BITCODE:
                NO

              DEAD_CODE_STRIPPING:
                YES

              ONLY_ACTIVE_ARCH:
                NO

          targets:

            Postal2BoxedWine:

              type:
                application

              platform:
                iOS

              info:

                path:
                  IOSHost/Info.plist

              sources:

                - path:
                    IOSHost

                - path:
                    Boxedwine/source

                  excludes:

                    - "test/**"

                    - "ui/**"

                    - "vulkan/**"

                    - "opengl/osmesa/**"

                - path:
                    Boxedwine/platform/sdl

                  excludes:

                    - "kvulkanSDL.cpp"

                    - "kvulkanSDL.h"

              settings:

                base:

                  PRODUCT_BUNDLE_IDENTIFIER:
                    com.postal2.boxedwine

                  PRODUCT_NAME:
                    POSTAL2

                  TARGETED_DEVICE_FAMILY:
                    "1,2"

                  ARCHS:
                    arm64

                  HEADER_SEARCH_PATHS:

                    - "$(SRCROOT)/Boxedwine/include"

                    - "$(SRCROOT)/Boxedwine/source"

                    - "$(SRCROOT)/Boxedwine/source/**"

                    - "$(SRCROOT)/Boxedwine/platform/sdl"

                    - "$(SRCROOT)/SDL2/include"

                    - "$(SRCROOT)/Vendor/include"

                    - "$(SRCROOT)/Vendor/include/minizip"

                    - "$(SRCROOT)/SIMDe"

                  LIBRARY_SEARCH_PATHS:

                    - "$(SRCROOT)/Vendor"

                  GCC_PREPROCESSOR_DEFINITIONS:

                    - "$(inherited)"

                    - "BOXEDWINE_64=1"

                    - "BOXEDWINE_OPENGL_SDL=1"

                    - "BOXEDWINE_OPENGL_ES=1"

                    - "BOXEDWINE_ES=1"

                    - "BOXEDWINE_ZLIB=1"

                    - "BOXEDWINE_DISABLE_UI=1"

                    - "BOXEDWINE_IOS_HOST=1"

                    - "SIMDE_NO_NATIVE=1"

                    - "SIMDE_NO_VECTOR=1"

                    - "SIMDE_NO_CHECK_IMMEDIATE_CONSTANT=1"

                    - "GLH=<SDL_opengles2.h>"

                  OTHER_CFLAGS:

                    - "$(inherited)"

                    - "-Wno-error"

                  OTHER_CPLUSPLUSFLAGS:

                    - "$(inherited)"

                    - "-std=gnu++20"

                    - "-Wno-error"

                    - "-Wno-deprecated-declarations"

                    - "-Wno-unused-variable"

                    - "-Wno-unused-function"

                    - "-Wno-unused-private-field"

                    - "-Wno-c++11-narrowing"

                  OTHER_LDFLAGS:

                    - "$(inherited)"

                    - "-lSDL2"

                    - "-lminizip"

                    - "-lz"

                    - "-lc++"

              dependencies:

                - sdk:
                    UIKit.framework

                - sdk:
                    Foundation.framework

                - sdk:
                    OpenGLES.framework

                - sdk:
                    QuartzCore.framework

                - sdk:
                    AudioToolbox.framework

                - sdk:
                    AVFoundation.framework

                - sdk:
                    CoreAudio.framework

                - sdk:
                    CoreGraphics.framework

                - sdk:
                    CoreMotion.framework

                - sdk:
                    GameController.framework

                - sdk:
                    CoreHaptics.framework

          EOF

          xcodegen generate

          test -d \
            Postal2BoxedWine.xcodeproj

          echo "===== BUILD SETTINGS ====="

          xcodebuild \
            -project Postal2BoxedWine.xcodeproj \
            -scheme Postal2BoxedWine \
            -showBuildSettings \
            | grep -E \
            "CLANG_CXX_LANGUAGE_STANDARD|GCC_PREPROCESSOR_DEFINITIONS|HEADER_SEARCH_PATHS" \
            || true

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build iPhone BoxedWine
        shell: bash
        run: |
          set +e
          set -o pipefail

          rm -f \
            boxedwine-ios-build.log

          xcodebuild \
            -quiet \
            -project Postal2BoxedWine.xcodeproj \
            -scheme Postal2BoxedWine \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_CXX_LANGUAGE_STANDARD=gnu++20 \
            build \
            2>&1 \
            | tee boxedwine-ios-build.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "======================================"
          echo "REAL BOXEDWINE ERRORS"
          echo "======================================"

          grep -Ei \
            "error:|fatal error:|undefined symbols|duplicate symbol|file not found|no such file|cannot find|no such module|unsupported|architecture|ld:" \
            boxedwine-ios-build.log \
            || true

          echo
          echo "======================================"
          echo "BUILD STATUS: $STATUS"
          echo "======================================"

          if [ "$STATUS" != "0" ]; then

              echo
              echo "===== LAST 250 LINES ====="

              tail -250 \
                boxedwine-ios-build.log \
                || true

          fi

          exit "$STATUS"

      # ==========================================================
      # FIND APP
      # ==========================================================

      - name: Find app
        if: success()
        run: |
          set -e

          APP="$(
            find \
              build/Build/Products \
              -type d \
              -name '*.app' \
              -path '*Release-iphoneos*' \
              | head -1
          )"

          if [ -z "$APP" ]; then

              echo "ERROR: iPhone .app not found"

              exit 1

          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "===== APP ====="

          echo "$APP"

          du -sh "$APP"

      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Create IPA
        if: success()
        run: |
          set -e

          rm -rf Payload

          mkdir -p Payload

          cp -R \
            "$APP" \
            Payload/

          /usr/bin/zip \
            -r \
            -9 \
            POSTAL2-BoxedWine-iOS.ipa \
            Payload

          test -f \
            POSTAL2-BoxedWine-iOS.ipa

          echo "===== IPA ====="

          ls -lh \
            POSTAL2-BoxedWine-iOS.ipa

      # ==========================================================
      # RELEASE
      # ==========================================================

      - name: Publish IPA to Releases
        if: success()

        env:

          GH_TOKEN:
            ${{ github.token }}

        run: |
          set -e

          TAG="postal2-ios-${GITHUB_RUN_NUMBER}"

          echo "===== RELEASE ====="

          echo "$TAG"

          gh release create \
            "$TAG" \
            POSTAL2-BoxedWine-iOS.ipa \
            --target "${GITHUB_SHA}" \
            --title "POSTAL 2 iOS Build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned POSTAL 2 BoxedWine iOS runtime."

          {
              echo
              echo "# POSTAL 2 IPA READY"
              echo
              echo "Открой Releases."
              echo
              echo "Скачай POSTAL2-BoxedWine-iOS.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
