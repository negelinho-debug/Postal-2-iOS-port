name: POSTAL 2 BoxedWine iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BoxedWine iPhone Runtime
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e

          brew install xcodegen

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone BoxedWine
        run: |
          set -e

          rm -rf Boxedwine

          git clone \
            --depth 1 \
            https://github.com/danoon2/Boxedwine.git \
            Boxedwine

          cd Boxedwine

          echo "===== BOXEDWINE ====="
          git rev-parse HEAD

          test -d source
          test -f source/sdl/main.cpp

      - name: Clone SDL2
        run: |
          set -e

          rm -rf SDL2

          git clone \
            --depth 1 \
            --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git \
            SDL2

          test -d SDL2/Xcode/SDL
          test -d SDL2/include

      - name: Build SDL2 for iPhone
        run: |
          set -e
          set -o pipefail

          cd SDL2

          rm -rf sdlbuild

          xcodebuild \
            -project Xcode/SDL/SDL.xcodeproj \
            -target "Static Library-iOS" \
            -configuration Release \
            -sdk iphoneos \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/sdlbuild" \
            build \
            2>&1 | tee sdl-build.log

          SDL_LIB="$(find sdlbuild \
            -type f \
            -name 'libSDL2.a' \
            | head -1)"

          if [ -z "$SDL_LIB" ]; then
            echo "ERROR: libSDL2.a not found"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/Vendor"

          cp "$SDL_LIB" \
            "$GITHUB_WORKSPACE/Vendor/libSDL2.a"

          file \
            "$GITHUB_WORKSPACE/Vendor/libSDL2.a"

      - name: Clone zlib
        run: |
          set -e

          rm -rf zlib-src

          git clone \
            --depth 1 \
            https://github.com/madler/zlib.git \
            zlib-src

          mkdir -p Vendor/include/minizip

          cp zlib-src/contrib/minizip/*.h \
            Vendor/include/minizip/

      - name: Build minizip
        run: |
          set -e

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"

          rm -rf minizip-build
          mkdir minizip-build

          for SRC in \
            ioapi.c \
            unzip.c \
            zip.c \
            mztools.c
          do

            "$CC" \
              -c \
              -O3 \
              -arch arm64 \
              -isysroot "$SDK" \
              -miphoneos-version-min=15.0 \
              -Izlib-src \
              -Izlib-src/contrib/minizip \
              "zlib-src/contrib/minizip/$SRC" \
              -o \
              "minizip-build/${SRC%.c}.o"

          done

          /usr/bin/libtool \
            -static \
            -o Vendor/libminizip.a \
            minizip-build/*.o

          file Vendor/libminizip.a

      - name: Create iPhone launcher
        run: |
          set -e

          mkdir -p IOSHost

          cat > IOSHost/main.mm <<'EOF'
          #import <Foundation/Foundation.h>

          #include <SDL.h>
          #include <unistd.h>
          #include <sys/stat.h>

          #include <string>
          #include <vector>

          extern int boxedmain(
              int argc,
              const char **argv
          );

          static bool exists(
              const std::string& path
          ) {
              struct stat st {};
              return stat(
                  path.c_str(),
                  &st
              ) == 0;
          }

          static void message(
              const char* title,
              const char* text
          ) {
              SDL_Init(
                  SDL_INIT_VIDEO
              );

              SDL_ShowSimpleMessageBox(
                  SDL_MESSAGEBOX_INFORMATION,
                  title,
                  text,
                  nullptr
              );

              SDL_Quit();
          }

          int main(
              int argc,
              char* argv[]
          ) {
              @autoreleasepool {

                  NSArray *paths =
                      NSSearchPathForDirectoriesInDomains(
                          NSDocumentDirectory,
                          NSUserDomainMask,
                          YES
                      );

                  NSString *documents =
                      [paths firstObject];

                  if (!documents) {
                      return 1;
                  }

                  std::string docs(
                      [documents
                          fileSystemRepresentation]
                  );

                  chdir(
                      docs.c_str()
                  );

                  std::string wineZip =
                      docs + "/Wine.zip";

                  if (!exists(wineZip)) {

                      std::string alt =
                          docs +
                          "/Wine-5.0.zip";

                      if (exists(alt)) {
                          wineZip = alt;
                      }
                  }

                  std::string game =
                      docs + "/postal2";

                  std::string exe =
                      game +
                      "/System/Postal2.exe";

                  if (!exists(wineZip)) {

                      message(
                          "POSTAL 2",
                          "Положи Wine.zip в папку POSTAL 2 через приложение Файлы."
                      );

                      return 0;
                  }

                  if (!exists(exe)) {

                      message(
                          "POSTAL 2",
                          "Положи папку postal2 в Documents приложения."
                      );

                      return 0;
                  }

                  std::string root =
                      docs + "/root";

                  mkdir(
                      root.c_str(),
                      0755
                  );

                  const char* glext =
                      "GL_EXT_multi_draw_arrays "
                      "GL_ARB_vertex_program "
                      "GL_ARB_fragment_program "
                      "GL_ARB_multitexture "
                      "GL_EXT_secondary_color "
                      "GL_EXT_texture_lod_bias "
                      "GL_ARB_texture_env_combine "
                      "GL_EXT_texture_env_combine "
                      "GL_EXT_texture_filter_anisotropic "
                      "GL_EXT_texture_compression_s3tc "
                      "GL_ARB_texture_compression";

                  std::vector<std::string> s = {

                      "BoxedWine",

                      "-root",
                      root,

                      "-zip",
                      wineZip,

                      "-mount_drive",
                      game,
                      "d",

                      "-fullscreen",

                      "-forceRelativeMouse",

                      "-resolution",
                      "960x540",

                      "-bpp",
                      "32",

                      "-vsync",
                      "1",

                      "-p3",

                      "-glext",
                      glext,

                      "-title",
                      "POSTAL 2",

                      "/bin/wine",

                      "d:\\System\\Postal2.exe"
                  };

                  std::vector<const char*> a;

                  for (
                      auto& value : s
                  ) {
                      a.push_back(
                          value.c_str()
                      );
                  }

                  return boxedmain(
                      (int)a.size(),
                      a.data()
                  );
              }
          }
          EOF

      - name: Create Info plist
        run: |
          cat > IOSHost/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>CFBundleDisplayName</key>
              <string>POSTAL 2</string>

              <key>CFBundleName</key>
              <string>POSTAL 2</string>

              <key>CFBundleIdentifier</key>
              <string>com.postal2.boxedwine</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>0.1</string>

              <key>CFBundleVersion</key>
              <string>1</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UIFileSharingEnabled</key>
              <true/>

              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>

              <key>UIRequiresFullScreen</key>
              <true/>

              <key>UISupportedInterfaceOrientations</key>

              <array>

                  <string>
                  UIInterfaceOrientationLandscapeLeft
                  </string>

                  <string>
                  UIInterfaceOrientationLandscapeRight
                  </string>

              </array>

              <key>
              UIApplicationSupportsIndirectInputEvents
              </key>

              <true/>

              <key>UILaunchScreen</key>

              <dict/>

          </dict>

          </plist>
          EOF

      - name: Create Xcode project
        run: |
          cat > project.yml <<'EOF'
          name: Postal2BoxedWine

          options:

            bundleIdPrefix:
              com.postal2

            deploymentTarget:

              iOS:
                "15.0"

          settings:

            base:

              IPHONEOS_DEPLOYMENT_TARGET:
                "15.0"

              CLANG_CXX_LANGUAGE_STANDARD:
                gnu++17

              CLANG_CXX_LIBRARY:
                libc++

              GCC_C_LANGUAGE_STANDARD:
                gnu11

              ENABLE_BITCODE:
                NO

              DEAD_CODE_STRIPPING:
                YES

              ONLY_ACTIVE_ARCH:
                NO

          targets:

            Postal2BoxedWine:

              type:
                application

              platform:
                iOS

              info:

                path:
                  IOSHost/Info.plist

              sources:

                - path:
                    IOSHost

                - path:
                    Boxedwine/source

                  excludes:

                    - "test/**"

                    - "ui/**"

                    - "vulkan/**"

              settings:

                base:

                  PRODUCT_BUNDLE_IDENTIFIER:
                    com.postal2.boxedwine

                  PRODUCT_NAME:
                    POSTAL2

                  TARGETED_DEVICE_FAMILY:
                    "1,2"

                  ARCHS:
                    arm64

                  HEADER_SEARCH_PATHS:

                    - "$(SRCROOT)/Boxedwine/include"

                    - "$(SRCROOT)/Boxedwine/source"

                    - "$(SRCROOT)/Boxedwine/source/**"

                    - "$(SRCROOT)/SDL2/include"

                    - "$(SRCROOT)/Vendor/include"

                    - "$(SRCROOT)/Vendor/include/minizip"

                  LIBRARY_SEARCH_PATHS:

                    - "$(SRCROOT)/Vendor"

                  GCC_PREPROCESSOR_DEFINITIONS:

                    - "$(inherited)"

                    - "BOXEDWINE_64=1"

                    - "BOXEDWINE_ES=1"

                    - "BOXEDWINE_OPENGL_SDL=1"

                    - "BOXEDWINE_ZLIB=1"

                    - "BOXEDWINE_DISABLE_UI=1"

                    - "GLH=<SDL_opengles2.h>"

                  OTHER_CFLAGS:

                    - "$(inherited)"

                    - "-Wno-error"

                  OTHER_CPLUSPLUSFLAGS:

                    - "$(inherited)"

                    - "-Wno-error"

                    - "-Wno-deprecated-declarations"

                    - "-Wno-unused-variable"

                    - "-Wno-unused-function"

                    - "-Wno-unused-private-field"

                    - "-Wno-c++11-narrowing"

                  OTHER_LDFLAGS:

                    - "$(inherited)"

                    - "-lSDL2"

                    - "-lminizip"

                    - "-lz"

                    - "-lc++"

              dependencies:

                - sdk:
                    UIKit.framework

                - sdk:
                    Foundation.framework

                - sdk:
                    OpenGLES.framework

                - sdk:
                    QuartzCore.framework

                - sdk:
                    AudioToolbox.framework

                - sdk:
                    AVFoundation.framework

                - sdk:
                    CoreAudio.framework

                - sdk:
                    CoreGraphics.framework

                - sdk:
                    CoreMotion.framework

                - sdk:
                    GameController.framework

          EOF

          xcodegen generate

          test -d \
            Postal2BoxedWine.xcodeproj

      - name: Build iPhone BoxedWine
        id: boxedwine_build
        shell: bash
        run: |
          set +e
          set -o pipefail

          rm -f \
            boxedwine-ios-build.log \
            boxedwine-errors.txt

          xcodebuild \
            -project Postal2BoxedWine.xcodeproj \
            -scheme Postal2BoxedWine \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee boxedwine-ios-build.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "===== BUILD STATUS: $STATUS ====="

          grep -Ei \
            "(^| )error:|fatal error:|undefined symbols|duplicate symbol|no such file|file not found|cannot find|no such module|unsupported|architecture|ld:" \
            boxedwine-ios-build.log \
            > boxedwine-errors.txt \
            || true

          {
            echo "# POSTAL 2 iOS Build"

            echo

            if [ "$STATUS" = "0" ]; then

              echo "## ✅ BOXEDWINE COMPILED"

            else

              echo "## ❌ REAL COMPILER ERRORS"

              echo

              echo '```text'

              if [ -s boxedwine-errors.txt ]; then

                tail -120 \
                  boxedwine-errors.txt

              else

                echo "GitHub did not find a normal error line."

                echo

                echo "Last 100 lines:"

                tail -100 \
                  boxedwine-ios-build.log

              fi

              echo '```'

            fi

          } >> "$GITHUB_STEP_SUMMARY"

          exit "$STATUS"

      - name: Find app
        if: success()
        run: |
          set -e

          APP="$(find \
            build/Build/Products \
            -type d \
            -name '*.app' \
            -path '*Release-iphoneos*' \
            | head -1)"

          if [ -z "$APP" ]; then

            echo "ERROR: iPhone app not found"

            exit 1

          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "===== APP ====="

          echo "$APP"

          du -sh "$APP"

      - name: Create IPA
        if: success()
        run: |
          set -e

          rm -rf Payload

          mkdir Payload

          cp -R \
            "$APP" \
            Payload/

          /usr/bin/zip \
            -r \
            -9 \
            POSTAL2-BoxedWine-iOS.ipa \
            Payload

          test -f \
            POSTAL2-BoxedWine-iOS.ipa

          echo "===== IPA ====="

          ls -lh \
            POSTAL2-BoxedWine-iOS.ipa

      # We use GitHub Releases instead of Actions Artifacts.
      # Your Actions artifact quota is currently full.

      - name: Publish IPA to Releases
        if: success()
        env:

          GH_TOKEN:
            ${{ github.token }}

        run: |
          set -e

          TAG="postal2-ios-${GITHUB_RUN_NUMBER}"

          echo "TAG=$TAG"

          gh release delete \
            "$TAG" \
            --yes \
            --cleanup-tag \
            2>/dev/null \
            || true

          gh release create \
            "$TAG" \
            POSTAL2-BoxedWine-iOS.ipa \
            --target "${GITHUB_SHA}" \
            --title "POSTAL 2 iOS Build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned POSTAL 2 BoxedWine iOS runtime."

          {
            echo
            echo "## ✅ IPA READY"
            echo
            echo "Открой вкладку Releases этого репозитория."
            echo
            echo "Скачай POSTAL2-BoxedWine-iOS.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
