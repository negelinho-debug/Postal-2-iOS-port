name: POSTAL 2 BoxedWine iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BoxedWine iPhone Runtime
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install xcodegen

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

      # ==========================================================
      # BOXEDWINE
      # ==========================================================

      - name: Clone BoxedWine
        run: |
          set -e

          rm -rf Boxedwine

          git clone \
            --depth 1 \
            https://github.com/danoon2/Boxedwine.git \
            Boxedwine

          echo "===== BOXEDWINE ====="

          cd Boxedwine
          git rev-parse HEAD
          cd ..

          test -f Boxedwine/source/sdl/main.cpp
          test -f Boxedwine/source/util/networkutils.cpp
          test -f Boxedwine/source/util/bhashtable.h
          test -f Boxedwine/source/opengl/glcommon.h
          test -f Boxedwine/source/opengl/glMarshal.h
          test -f Boxedwine/source/opengl/es/esopengl.c
          test -f Boxedwine/source/opengl/sdl/sdlgl.cpp
          test -f Boxedwine/platform/sdl/knativesystem.cpp

      # ==========================================================
      # NEW RUN #20 FIX
      #
      # Current BoxedWine master still has:
      #
      #   #include "kalloc.h"
      #
      # inside esopengl.c, although that header no longer exists
      # in the current source tree and esopengl.c doesn't use it.
      # ==========================================================

      - name: Remove obsolete kalloc include
        run: |
          set -e

          FILE="Boxedwine/source/opengl/es/esopengl.c"

          echo "===== BEFORE ====="

          grep \
            -n \
            'kalloc.h' \
            "$FILE" \
            || true

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "Boxedwine/source/opengl/es/esopengl.c"
          )

          text = path.read_text()

          old = '#include "kalloc.h"\n'

          if old in text:
              text = text.replace(
                  old,
                  "",
                  1
              )

              path.write_text(text)

              print(
                  "Removed obsolete kalloc.h include"
              )

          else:
              print(
                  "kalloc.h include already absent"
              )
          PY

          echo
          echo "===== AFTER ====="

          if grep \
            -q \
            'kalloc.h' \
            "$FILE"
          then
              echo "ERROR: kalloc.h still present"
              exit 1
          fi

          echo "KALLOC FIX PASSED"

      # ==========================================================
      # BHASHTABLE
      # ==========================================================

      - name: Patch BHashTable
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "Boxedwine/source/util/bhashtable.h"
          )

          text = path.read_text()

          marker = (
              "struct iterator : public const_iterator {"
          )

          if "using const_iterator::owner;" not in text:

              if marker not in text:
                  raise SystemExit(
                      "BHashTable iterator not found"
                  )

              replacement = """struct iterator : public const_iterator {
              using const_iterator::owner;
              using const_iterator::slot_index;
          """

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

              path.write_text(text)

          print(
              "BHashTable patch OK"
          )
          PY

      # ==========================================================
      # DISABLE CURL
      # ==========================================================

      - name: Disable BoxedWine downloader on iOS
        run: |
          set -e

          cat > Boxedwine/source/util/networkutils.cpp <<'EOF'
          #include "boxedwine.h"
          #include "networkutils.h"

          bool downloadFile(
              BString url,
              BString filePath,
              std::function<void(U64 bytesCompleted)> callback,
              NetworkProxy* proxy,
              BString& errorMsg,
              bool* cancel
          ) {
              (void)url;
              (void)filePath;
              (void)callback;
              (void)proxy;
              (void)cancel;

              errorMsg = BString::copy(
                  "Network downloader disabled on iOS"
              );

              return false;
          }
          EOF

          if grep \
            -q \
            "curl/curl.h" \
            Boxedwine/source/util/networkutils.cpp
          then
              echo "ERROR: curl still present"
              exit 1
          fi

          echo "CURL disabled"

      # ==========================================================
      # SIMDE
      # ==========================================================

      - name: Clone SIMDe
        run: |
          set -e

          rm -rf SIMDe

          git clone \
            --depth 1 \
            --branch v0.8.2 \
            https://github.com/simd-everywhere/simde.git \
            SIMDe

          test -f SIMDe/simde/x86/sse.h
          test -f SIMDe/simde/x86/sse2.h

      - name: Patch SIMDe
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "SIMDe/simde/x86/sse2.h"
          )

          text = path.read_text()

          start = text.find(
              "simde_mm_cvtpd_ps"
          )

          if start < 0:
              raise SystemExit(
                  "simde_mm_cvtpd_ps not found"
              )

          end = text.find(
              "#if defined(SIMDE_X86_SSE2_ENABLE_NATIVE_ALIASES)",
              start
          )

          if end < 0:
              raise SystemExit(
                  "SIMDe block end not found"
              )

          block = text[start:end]

          broken = (
              "#elif HEDLEY_HAS_BUILTIN("
              "__builtin_shufflevector"
              ") && HEDLEY_HAS_BUILTIN("
              "__builtin_convertvector"
              ")"
          )

          fixed = (
              "#elif 0 "
              "/* iPhone scalar fallback */"
          )

          if fixed not in block:

              if broken not in block:
                  raise SystemExit(
                      "SIMDe branch not found"
                  )

              block = block.replace(
                  broken,
                  fixed,
                  1
              )

              text = (
                  text[:start]
                  + block
                  + text[end:]
              )

              path.write_text(text)

          print(
              "SIMDe patch OK"
          )
          PY

      # ==========================================================
      # SDL2
      # ==========================================================

      - name: Clone SDL2
        run: |
          set -e

          rm -rf SDL2

          git clone \
            --depth 1 \
            --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git \
            SDL2

          test -d SDL2/include
          test -d SDL2/Xcode/SDL

      - name: Build SDL2 for iPhone
        run: |
          set -e
          set -o pipefail

          cd SDL2

          rm -rf sdlbuild

          xcodebuild \
            -project Xcode/SDL/SDL.xcodeproj \
            -target "Static Library-iOS" \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/sdlbuild" \
            build \
            2>&1 \
            | tee sdl-build.log

          SDL_LIB="$(
            find sdlbuild \
              -type f \
              -name 'libSDL2.a' \
              | head -1
          )"

          if [ -z "$SDL_LIB" ]; then
              echo "ERROR: libSDL2.a not found"
              exit 1
          fi

          mkdir -p \
            "$GITHUB_WORKSPACE/Vendor"

          cp \
            "$SDL_LIB" \
            "$GITHUB_WORKSPACE/Vendor/libSDL2.a"

          echo "===== SDL2 ====="

          file \
            "$GITHUB_WORKSPACE/Vendor/libSDL2.a"

      # ==========================================================
      # COMPLETE OPENGL COMPATIBILITY
      #
      # Generate classic desktop GL constants automatically,
      # rather than adding GL_* names one by one.
      # ==========================================================

      - name: Create complete OpenGL compatibility layer
        run: |
          set -e

          rm -rf IOSCompat

          mkdir -p \
            IOSCompat/GL \
            IOSCompat/KHR

          echo "===== DOWNLOAD glext.h ====="

          curl \
            --fail \
            --location \
            --retry 3 \
            https://raw.githubusercontent.com/KhronosGroup/OpenGL-Registry/main/api/GL/glext.h \
            -o IOSCompat/GL/glext.h

          echo "===== DOWNLOAD khrplatform.h ====="

          curl \
            --fail \
            --location \
            --retry 3 \
            https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/main/api/KHR/khrplatform.h \
            -o IOSCompat/KHR/khrplatform.h

          echo "===== DOWNLOAD CLASSIC GL HEADER ====="

          curl \
            --fail \
            --location \
            --retry 3 \
            https://raw.githubusercontent.com/emscripten-core/emscripten/main/system/include/GL/gl.h \
            -o IOSCompat/DesktopGL.h

          test -s IOSCompat/GL/glext.h
          test -s IOSCompat/KHR/khrplatform.h
          test -s IOSCompat/DesktopGL.h

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "IOSCompat/DesktopGL.h"
          ).read_text(
              errors="replace"
          ).splitlines()

          pattern = re.compile(
              r'^\s*#define\s+'
              r'(GL_[A-Za-z0-9_]+)\s+'
              r'(0x[0-9A-Fa-f]+[uUlL]*|[0-9]+[uUlL]*)'
              r'(?:\s|$)'
          )

          constants = {}

          for line in source:
              match = pattern.match(line)

              if not match:
                  continue

              name = match.group(1)
              value = match.group(2)

              constants[name] = value

          if len(constants) < 300:
              raise SystemExit(
                  f"Too few GL constants extracted: "
                  f"{len(constants)}"
              )

          out = []

          out.append(
              "#ifndef BOXEDWINE_IOS_LEGACY_GL_CONSTANTS_H"
          )

          out.append(
              "#define BOXEDWINE_IOS_LEGACY_GL_CONSTANTS_H"
          )

          out.append("")

          for name in sorted(constants):

              out.append(
                  f"#ifndef {name}"
              )

              out.append(
                  f"#define {name} {constants[name]}"
              )

              out.append(
                  "#endif"
              )

              out.append("")

          out.append(
              "#endif"
          )

          Path(
              "IOSCompat/LegacyGLConstants.h"
          ).write_text(
              "\n".join(out)
              + "\n"
          )

          print(
              f"Generated {len(constants)} "
              f"legacy OpenGL constants"
          )
          PY

          cat > IOSCompat/IOSGLCompat.h <<'EOF'
          #ifndef BOXEDWINE_IOS_GL_COMPAT_H
          #define BOXEDWINE_IOS_GL_COMPAT_H

          #include <SDL_opengles2.h>

          #ifndef GLAPIENTRY
          #define GLAPIENTRY APIENTRY
          #endif

          #ifndef GLdouble
          typedef double GLdouble;
          #endif

          #ifndef GLclampd
          typedef double GLclampd;
          #endif

          #include <LegacyGLConstants.h>
          #include <GL/glext.h>

          #endif
          EOF

          echo
          echo "===== LEGACY GL CONSTANT COUNT ====="

          grep \
            -c \
            '^#define GL_' \
            IOSCompat/LegacyGLConstants.h

          echo
          echo "===== VERIFY IMPORTANT GL VALUES ====="

          for NAME in \
            GL_MAP2_INDEX \
            GL_MAP2_TEXTURE_COORD_1 \
            GL_MAP2_TEXTURE_COORD_2 \
            GL_MAP2_VERTEX_3 \
            GL_MAP2_NORMAL \
            GL_MAP2_TEXTURE_COORD_3 \
            GL_MAP2_VERTEX_4 \
            GL_MAP2_COLOR_4 \
            GL_MAP2_TEXTURE_COORD_4 \
            GL_COEFF \
            GL_ORDER \
            GL_DOMAIN \
            GL_FOG_COLOR \
            GL_TEXTURE_WIDTH \
            GL_TEXTURE_HEIGHT \
            GL_TEXTURE_1D \
            GL_TEXTURE_BORDER_COLOR \
            GL_TEXTURE_ENV_COLOR \
            GL_OBJECT_PLANE \
            GL_EYE_PLANE
          do

              if ! grep \
                  -q \
                  "#define $NAME " \
                  IOSCompat/LegacyGLConstants.h
              then
                  echo "ERROR: missing $NAME"
                  exit 1
              fi

              echo "OK: $NAME"

          done

      # ==========================================================
      # TEST GL COMPATIBILITY BEFORE FULL BUILD
      # ==========================================================

      - name: Test legacy OpenGL compatibility
        run: |
          set -e

          cat > /tmp/glcompat-test.cpp <<'EOF'
          #include <IOSGLCompat.h>

          GLdouble testDouble = 0.0;
          GLclampd testClamp = 0.0;

          GLhandleARB testHandle = 0;
          GLcharARB testChar = 0;

          GLintptrARB testPointer = 0;
          GLsizeiptrARB testSize = 0;

          GLenum a = GL_MAP2_INDEX;
          GLenum b = GL_MAP2_TEXTURE_COORD_1;
          GLenum c = GL_MAP2_TEXTURE_COORD_2;
          GLenum d = GL_MAP2_VERTEX_3;
          GLenum e = GL_MAP2_NORMAL;
          GLenum f = GL_MAP2_TEXTURE_COORD_3;
          GLenum g = GL_MAP2_VERTEX_4;
          GLenum h = GL_MAP2_COLOR_4;
          GLenum i = GL_MAP2_TEXTURE_COORD_4;

          GLenum j = GL_COEFF;
          GLenum k = GL_ORDER;
          GLenum l = GL_DOMAIN;
          GLenum m = GL_FOG_COLOR;
          GLenum n = GL_TEXTURE_WIDTH;
          GLenum o = GL_TEXTURE_HEIGHT;
          GLenum p = GL_TEXTURE_1D;
          GLenum q = GL_TEXTURE_BORDER_COLOR;
          GLenum r = GL_TEXTURE_ENV_COLOR;
          GLenum s = GL_OBJECT_PLANE;
          GLenum t = GL_EYE_PLANE;

          typedef void (
              GLAPIENTRY *TestProc
          )();

          TestProc testProc = nullptr;

          int main() {
              (void)testDouble;
              (void)testClamp;
              (void)testHandle;
              (void)testChar;
              (void)testPointer;
              (void)testSize;

              (void)a;
              (void)b;
              (void)c;
              (void)d;
              (void)e;
              (void)f;
              (void)g;
              (void)h;
              (void)i;
              (void)j;
              (void)k;
              (void)l;
              (void)m;
              (void)n;
              (void)o;
              (void)p;
              (void)q;
              (void)r;
              (void)s;
              (void)t;
              (void)testProc;

              return 0;
          }
          EOF

          SDK="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          CXX="$(
            xcrun \
              --sdk iphoneos \
              -f clang++
          )"

          "$CXX" \
            -std=gnu++20 \
            -fsyntax-only \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -IIOSCompat \
            -ISDL2/include \
            /tmp/glcompat-test.cpp

          echo
          echo "======================================"
          echo "LEGACY OPENGL TEST PASSED"
          echo "======================================"

      # ==========================================================
      # BOXEDWINE GL COMMON
      # ==========================================================

      - name: Patch BoxedWine GL common header
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "Boxedwine/source/opengl/glcommon.h"
          )

          text = path.read_text()

          marker = (
              "#ifdef BOXEDWINE_OPENGL\n"
          )

          if (
              "#include <IOSGLCompat.h>"
              not in text
          ):

              if marker not in text:
                  raise SystemExit(
                      "BOXEDWINE_OPENGL marker not found"
                  )

              replacement = """#ifdef BOXEDWINE_OPENGL

          #ifdef BOXEDWINE_IOS_HOST
          #include <IOSGLCompat.h>
          #endif
          """

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

              path.write_text(text)

          print(
              "glcommon.h patch OK"
          )
          PY

      # ==========================================================
      # GLhandleARB
      # ==========================================================

      - name: Verify GLhandleARB pointer support
        run: |
          set -e

          grep \
            -n \
            "BOXEDWINE_GLHANDLE_ARB_POINTER" \
            Boxedwine/source/opengl/glMarshal.h

          grep \
            -n \
            "marshalIndexToHandle" \
            Boxedwine/source/opengl/glMarshal.h

          echo \
            "GLhandleARB pointer mapper OK"

      # ==========================================================
      # SDL OPENGL -> IPHONE GLES
      # ==========================================================

      - name: Patch SDL OpenGL for iPhone
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "Boxedwine/source/opengl/sdl/sdlgl.cpp"
          )

          if not path.exists():
              raise SystemExit(
                  "sdlgl.cpp not found"
              )

          text = path.read_text()

          text = text.replace(
              "#ifdef __APPLE__",
              "#if defined(__APPLE__) && TARGET_OS_OSX"
          )

          if (
              "#include <TargetConditionals.h>"
              not in text
          ):

              marker = (
                  '#include "boxedwine.h"\n'
              )

              replacement = """#include "boxedwine.h"

          #if defined(__APPLE__)
          #include <TargetConditionals.h>
          #endif
          """

              if marker not in text:
                  raise SystemExit(
                      "boxedwine include not found"
                  )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          text = text.replace(
              "#include <SDL_opengl.h>",
              "#include <IOSGLCompat.h>"
          )

          reset = (
              "    SDL_GL_ResetAttributes();"
          )

          es_setup = """    SDL_GL_ResetAttributes();

          #ifdef BOXEDWINE_ES
              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_PROFILE_MASK,
                  SDL_GL_CONTEXT_PROFILE_ES
              );

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MAJOR_VERSION,
                  2
              );

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MINOR_VERSION,
                  0
              );
          #endif"""

          if (
              "SDL_GL_CONTEXT_PROFILE_ES"
              not in text
          ):

              if reset not in text:
                  raise SystemExit(
                      "SDL_GL_ResetAttributes not found"
                  )

              text = text.replace(
                  reset,
                  es_setup,
                  1
              )

          path.write_text(text)

          print(
              "sdlgl.cpp iPhone patch OK"
          )
          PY

      # ==========================================================
      # DISABLE DEFAULT MAIN
      # ==========================================================

      - name: Disable BoxedWine default main
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "Boxedwine/platform/sdl/knativesystem.cpp"
          )

          text = path.read_text()

          old = (
              "#ifndef __TEST"
          )

          new = (
              "#if !defined(__TEST) && "
              "!defined(BOXEDWINE_IOS_HOST)"
          )

          if new not in text:

              if old not in text:
                  raise SystemExit(
                      "default main guard not found"
                  )

              text = text.replace(
                  old,
                  new,
                  1
              )

              path.write_text(text)

          print(
              "default main disabled"
          )
          PY

      # ==========================================================
      # ZLIB / MINIZIP
      # ==========================================================

      - name: Clone zlib
        run: |
          set -e

          rm -rf zlib-src

          git clone \
            --depth 1 \
            https://github.com/madler/zlib.git \
            zlib-src

          mkdir -p \
            Vendor/include/minizip

          cp \
            zlib-src/contrib/minizip/*.h \
            Vendor/include/minizip/

      - name: Build minizip
        run: |
          set -e

          SDK="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          CC="$(
            xcrun \
              --sdk iphoneos \
              -f clang
          )"

          rm -rf minizip-build

          mkdir -p minizip-build

          for SRC in \
            ioapi.c \
            unzip.c \
            zip.c \
            mztools.c
          do

              "$CC" \
                -c \
                -O3 \
                -arch arm64 \
                -isysroot "$SDK" \
                -miphoneos-version-min=15.0 \
                -Izlib-src \
                -Izlib-src/contrib/minizip \
                "zlib-src/contrib/minizip/$SRC" \
                -o \
                "minizip-build/${SRC%.c}.o"

          done

          /usr/bin/libtool \
            -static \
            -o \
            Vendor/libminizip.a \
            minizip-build/*.o

          echo "===== MINIZIP ====="

          file \
            Vendor/libminizip.a

      # ==========================================================
      # IPHONE LAUNCHER
      # ==========================================================

      - name: Create iPhone launcher
        run: |
          set -e

          mkdir -p IOSHost

          cat > IOSHost/main.mm <<'EOF'
          #import <Foundation/Foundation.h>

          #include <SDL.h>
          #include <sys/stat.h>
          #include <unistd.h>

          #include <string>
          #include <vector>

          extern int boxedmain(
              int argc,
              const char **argv
          );

          static bool exists(
              const std::string& path
          ) {
              struct stat st {};

              return stat(
                  path.c_str(),
                  &st
              ) == 0;
          }

          static void showMessage(
              const char* title,
              const char* text
          ) {
              SDL_Init(
                  SDL_INIT_VIDEO
              );

              SDL_ShowSimpleMessageBox(
                  SDL_MESSAGEBOX_INFORMATION,
                  title,
                  text,
                  nullptr
              );

              SDL_Quit();
          }

          int main(
              int argc,
              char* argv[]
          ) {
              @autoreleasepool {

                  NSArray *paths =
                      NSSearchPathForDirectoriesInDomains(
                          NSDocumentDirectory,
                          NSUserDomainMask,
                          YES
                      );

                  NSString *documents =
                      [paths firstObject];

                  if (!documents) {
                      return 1;
                  }

                  std::string docs(
                      [documents
                          fileSystemRepresentation]
                  );

                  chdir(
                      docs.c_str()
                  );

                  std::string wineZip =
                      docs + "/Wine.zip";

                  if (!exists(wineZip)) {

                      std::vector<std::string>
                          candidates = {

                          docs + "/Wine-5.0.zip",
                          docs + "/Wine-6.0.zip",
                          docs + "/Wine-7.0.zip",
                          docs + "/Wine-9.0.zip",
                          docs + "/Wine-10.0.zip",
                          docs + "/Wine-11.0.zip"
                      };

                      for (
                          const auto& candidate :
                          candidates
                      ) {

                          if (
                              exists(candidate)
                          ) {

                              wineZip =
                                  candidate;

                              break;
                          }
                      }
                  }

                  const std::string game =
                      docs + "/postal2";

                  const std::string exe =
                      game
                      + "/System/Postal2.exe";

                  if (!exists(wineZip)) {

                      showMessage(
                          "POSTAL 2",
                          "Нужен Wine.zip в папке приложения."
                      );

                      return 0;
                  }

                  if (!exists(exe)) {

                      showMessage(
                          "POSTAL 2",
                          "Положи папку postal2 в Documents приложения."
                      );

                      return 0;
                  }

                  const std::string root =
                      docs + "/root";

                  mkdir(
                      root.c_str(),
                      0755
                  );

                  const char* extensions =
                      "GL_EXT_multi_draw_arrays "
                      "GL_ARB_vertex_program "
                      "GL_ARB_fragment_program "
                      "GL_ARB_multitexture "
                      "GL_EXT_secondary_color "
                      "GL_EXT_texture_lod_bias "
                      "GL_NV_texture_env_combine4 "
                      "GL_ATI_texture_env_combine3 "
                      "GL_EXT_texture_filter_anisotropic "
                      "GL_ARB_texture_env_combine "
                      "GL_EXT_texture_env_combine "
                      "GL_EXT_texture_compression_s3tc "
                      "GL_ARB_texture_compression "
                      "GL_EXT_paletted_texture";

                  std::vector<std::string>
                      values = {

                      "BoxedWine",

                      "-root",
                      root,

                      "-zip",
                      wineZip,

                      "-mount_drive",
                      game,
                      "d",

                      "-fullscreen",

                      "-forceRelativeMouse",

                      "-resolution",
                      "960x540",

                      "-bpp",
                      "32",

                      "-vsync",
                      "1",

                      "-p3",

                      "-glext",
                      extensions,

                      "-title",
                      "POSTAL 2",

                      "/bin/wine",

                      "d:\\System\\Postal2.exe"
                  };

                  std::vector<const char*>
                      args;

                  for (
                      auto& value :
                      values
                  ) {

                      args.push_back(
                          value.c_str()
                      );
                  }

                  return boxedmain(
                      (int)args.size(),
                      args.data()
                  );
              }
          }
          EOF

      # ==========================================================
      # INFO.PLIST
      # ==========================================================

      - name: Create Info plist
        run: |
          set -e

          cat > IOSHost/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>CFBundleDisplayName</key>
              <string>POSTAL 2</string>

              <key>CFBundleName</key>
              <string>POSTAL 2</string>

              <key>CFBundleIdentifier</key>
              <string>com.postal2.boxedwine</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.8</string>

              <key>CFBundleVersion</key>
              <string>18</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UIFileSharingEnabled</key>
              <true/>

              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>

              <key>UIRequiresFullScreen</key>
              <true/>

              <key>UISupportedInterfaceOrientations</key>

              <array>

                  <string>
                  UIInterfaceOrientationLandscapeLeft
                  </string>

                  <string>
                  UIInterfaceOrientationLandscapeRight
                  </string>

              </array>

              <key>
              UIApplicationSupportsIndirectInputEvents
              </key>

              <true/>

              <key>UILaunchScreen</key>
              <dict/>

          </dict>

          </plist>
          EOF

      # ==========================================================
      # XCODE PROJECT
      # ==========================================================

      - name: Generate iPhone project
        run: |
          set -e

          cat > project.yml <<'EOF'
          name: Postal2BoxedWine

          options:

            bundleIdPrefix:
              com.postal2

            deploymentTarget:

              iOS:
                "15.0"

          settings:

            base:

              IPHONEOS_DEPLOYMENT_TARGET:
                "15.0"

              CLANG_CXX_LANGUAGE_STANDARD:
                gnu++20

              CLANG_CXX_LIBRARY:
                libc++

              GCC_C_LANGUAGE_STANDARD:
                gnu11

              ENABLE_BITCODE:
                NO

              DEAD_CODE_STRIPPING:
                YES

              ONLY_ACTIVE_ARCH:
                NO

          targets:

            Postal2BoxedWine:

              type:
                application

              platform:
                iOS

              info:

                path:
                  IOSHost/Info.plist

              sources:

                - path:
                    IOSHost

                - path:
                    Boxedwine/source

                  excludes:

                    - "test/**"
                    - "ui/**"
                    - "vulkan/**"
                    - "opengl/osmesa/**"

                - path:
                    Boxedwine/platform/sdl

                  excludes:

                    - "kvulkanSDL.cpp"
                    - "kvulkanSDL.h"

              settings:

                base:

                  PRODUCT_BUNDLE_IDENTIFIER:
                    com.postal2.boxedwine

                  PRODUCT_NAME:
                    POSTAL2

                  TARGETED_DEVICE_FAMILY:
                    "1,2"

                  ARCHS:
                    arm64

                  HEADER_SEARCH_PATHS:

                    - "$(SRCROOT)/IOSCompat"
                    - "$(SRCROOT)/Boxedwine/include"
                    - "$(SRCROOT)/Boxedwine/source"
                    - "$(SRCROOT)/Boxedwine/source/**"
                    - "$(SRCROOT)/Boxedwine/platform/sdl"
                    - "$(SRCROOT)/SDL2/include"
                    - "$(SRCROOT)/Vendor/include"
                    - "$(SRCROOT)/Vendor/include/minizip"
                    - "$(SRCROOT)/SIMDe"

                  LIBRARY_SEARCH_PATHS:

                    - "$(SRCROOT)/Vendor"

                  GCC_PREPROCESSOR_DEFINITIONS:

                    - "$(inherited)"

                    - "BOXEDWINE_64=1"

                    - "BOXEDWINE_OPENGL_SDL=1"

                    - "BOXEDWINE_ES=1"

                    - "BOXEDWINE_ZLIB=1"

                    - "BOXEDWINE_DISABLE_UI=1"

                    - "BOXEDWINE_IOS_HOST=1"

                    - "BOXEDWINE_GLHANDLE_ARB_POINTER=1"

                    - "SIMDE_NO_NATIVE=1"

                    - "SIMDE_NO_VECTOR=1"

                    - "SIMDE_NO_CHECK_IMMEDIATE_CONSTANT=1"

                    - "GLH=<IOSGLCompat.h>"

                  OTHER_CFLAGS:

                    - "$(inherited)"
                    - "-Wno-error"

                  OTHER_CPLUSPLUSFLAGS:

                    - "$(inherited)"
                    - "-std=gnu++20"
                    - "-Wno-error"
                    - "-Wno-deprecated-declarations"
                    - "-Wno-unused-variable"
                    - "-Wno-unused-function"
                    - "-Wno-unused-private-field"
                    - "-Wno-c++11-narrowing"

                  OTHER_LDFLAGS:

                    - "$(inherited)"
                    - "-lSDL2"
                    - "-lminizip"
                    - "-lz"
                    - "-lc++"

              dependencies:

                - sdk:
                    UIKit.framework

                - sdk:
                    Foundation.framework

                - sdk:
                    OpenGLES.framework

                - sdk:
                    QuartzCore.framework

                - sdk:
                    AudioToolbox.framework

                - sdk:
                    AVFoundation.framework

                - sdk:
                    CoreAudio.framework

                - sdk:
                    CoreGraphics.framework

                - sdk:
                    CoreMotion.framework

                - sdk:
                    GameController.framework

                - sdk:
                    CoreHaptics.framework

          EOF

          xcodegen generate

          test -d \
            Postal2BoxedWine.xcodeproj

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build iPhone BoxedWine
        shell: bash
        run: |
          set +e
          set -o pipefail

          rm -f \
            boxedwine-ios-build.log \
            boxedwine-build-status.txt

          xcodebuild \
            -quiet \
            -project Postal2BoxedWine.xcodeproj \
            -scheme Postal2BoxedWine \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 \
            | tee boxedwine-ios-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > boxedwine-build-status.txt

          echo
          echo "======================================"
          echo "BUILD STATUS: $STATUS"
          echo "======================================"

          echo
          echo "===== ERROR LINES ====="

          grep \
            -Eni \
            "error:|fatal error:|undefined symbols|duplicate symbol|linker command failed|ld:" \
            boxedwine-ios-build.log \
            || true

          exit 0

      # ==========================================================
      # UNIQUE ERROR LOG
      # ==========================================================

      - name: Save unique compiler error report
        shell: bash
        run: |
          set -e

          STATUS="$(
            cat boxedwine-build-status.txt
          )"

          if [ "$STATUS" = "0" ]; then

              echo \
                "Build succeeded. No error report required."

              exit 0
          fi

          ERROR_FILE="LAST_ERRORS_${GITHUB_RUN_NUMBER}.txt"

          python3 - "$ERROR_FILE" <<'PY'
          from pathlib import Path
          import sys

          output_path = Path(
              sys.argv[1]
          )

          log = Path(
              "boxedwine-ios-build.log"
          )

          if not log.exists():
              raise SystemExit(
                  "boxedwine-ios-build.log not found"
              )

          lines = log.read_text(
              errors="replace"
          ).splitlines()

          keywords = (
              "error:",
              "fatal error:",
              "undefined symbols",
              "duplicate symbol",
              "linker command failed",
              "ld:",
          )

          indexes = [
              i
              for i, line in enumerate(lines)
              if any(
                  keyword in line.lower()
                  for keyword in keywords
              )
          ]

          selected = set()

          for index in indexes:

              selected.update(
                  range(
                      max(
                          0,
                          index - 15
                      ),
                      min(
                          len(lines),
                          index + 18
                      )
                  )
              )

          output = [
              "POSTAL 2 iOS / BOXEDWINE",
              f"GITHUB RUN NUMBER: {output_path.stem}",
              "COMPLETE COMPILER ERROR REPORT",
              "=" * 72,
              f"Detected error lines: {len(indexes)}",
              ""
          ]

          previous = -100

          for index in sorted(
              selected
          ):

              if (
                  index >
                  previous + 1
              ):

                  output += [
                      "",
                      "-" * 72,
                      ""
                  ]

              output.append(
                  f"{index + 1}: "
                  f"{lines[index]}"
              )

              previous = index

          output += [
              "",
              "=" * 72,
              "LAST 500 RAW BUILD LINES",
              "=" * 72,
              ""
          ]

          tail = lines[-500:]

          first_line = (
              len(lines)
              - len(tail)
              + 1
          )

          for offset, line in enumerate(
              tail
          ):

              output.append(
                  f"{first_line + offset}: "
                  f"{line}"
              )

          result = (
              "\n".join(output)
              + "\n"
          )

          output_path.write_text(
              result
          )

          Path(
              "LAST_ERRORS_LATEST.txt"
          ).write_text(
              result
          )

          print(result)
          PY

          git config \
            user.name \
            "postal2-build-bot"

          git config \
            user.email \
            "actions@github.com"

          git add \
            -f \
            "$ERROR_FILE" \
            LAST_ERRORS_LATEST.txt

          if ! git diff \
            --cached \
            --quiet
          then

              git commit \
                -m \
                "Save BoxedWine iOS errors run ${GITHUB_RUN_NUMBER}"

              git push \
                origin \
                HEAD:main

          fi

      # ==========================================================
      # CHECK RESULT
      # ==========================================================

      - name: Check BoxedWine build result
        shell: bash
        run: |
          STATUS="$(
            cat boxedwine-build-status.txt
          )"

          if [ "$STATUS" != "0" ]; then

              echo
              echo "======================================"
              echo "BOXEDWINE BUILD FAILED"
              echo "LATEST ERROR LOG SAVED"
              echo "======================================"

              exit "$STATUS"

          fi

          echo
          echo "======================================"
          echo "BOXEDWINE BUILD SUCCEEDED"
          echo "======================================"

      # ==========================================================
      # FIND APP
      # ==========================================================

      - name: Find app
        run: |
          set -e

          APP="$(
            find \
              build/Build/Products \
              -type d \
              -name '*.app' \
              -path '*Release-iphoneos*' \
              | head -1
          )"

          if [ -z "$APP" ]; then
              echo "ERROR: app not found"
              exit 1
          fi

          echo \
            "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "===== APP ====="

          echo "$APP"

          du -sh "$APP"

      # ==========================================================
      # IPA
      # ==========================================================

      - name: Create IPA
        run: |
          set -e

          rm -rf Payload

          mkdir Payload

          cp \
            -R \
            "$APP" \
            Payload/

          /usr/bin/zip \
            -r \
            -9 \
            POSTAL2-BoxedWine-iOS.ipa \
            Payload

          test -f \
            POSTAL2-BoxedWine-iOS.ipa

          echo "===== IPA ====="

          ls -lh \
            POSTAL2-BoxedWine-iOS.ipa

      # ==========================================================
      # RELEASE
      # ==========================================================

      - name: Publish IPA to Releases
        env:

          GH_TOKEN:
            ${{ github.token }}

        run: |
          set -e

          TAG="postal2-ios-${GITHUB_RUN_NUMBER}"

          gh release create \
            "$TAG" \
            POSTAL2-BoxedWine-iOS.ipa \
            --target "${GITHUB_SHA}" \
            --title \
            "POSTAL 2 iOS Build ${GITHUB_RUN_NUMBER}" \
            --notes \
            "Unsigned POSTAL 2 BoxedWine iOS runtime."

          {
              echo
              echo "# ✅ POSTAL 2 IPA READY"
              echo
              echo "Открой Releases."
              echo
              echo \
                "Скачай POSTAL2-BoxedWine-iOS.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
