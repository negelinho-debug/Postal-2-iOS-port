name: POSTAL 2 BoxedWine iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BoxedWine iPhone Runtime
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install xcodegen

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== IPHONE SDK ====="
          xcrun --sdk iphoneos --show-sdk-version

      # ==========================================================
      # BOXEDWINE
      # ==========================================================

      - name: Clone BoxedWine
        run: |
          set -e

          rm -rf Boxedwine

          git clone \
            --depth 1 \
            https://github.com/danoon2/Boxedwine.git \
            Boxedwine

          echo "===== BOXEDWINE ====="

          cd Boxedwine
          git rev-parse HEAD
          cd ..

          test -d Boxedwine/source
          test -d Boxedwine/platform/sdl
          test -f Boxedwine/source/sdl/main.cpp
          test -f Boxedwine/source/opengl/glcommon.h
          test -f Boxedwine/source/opengl/glfunctions.h
          test -f Boxedwine/source/opengl/glfunctions_ext.h
          test -f Boxedwine/source/opengl/sdl/sdlgl.cpp
          test -f Boxedwine/source/opengl/es/esopengl.c

      # ==========================================================
      # BHASHTABLE APPLE CLANG FIX
      # ==========================================================

      - name: Patch BHashTable
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Boxedwine/source/util/bhashtable.h")
          text = path.read_text()

          marker = "struct iterator : public const_iterator {"

          if "using const_iterator::owner;" not in text:
              if marker not in text:
                  raise SystemExit("BHashTable iterator not found")

              replacement = """struct iterator : public const_iterator {
              using const_iterator::owner;
              using const_iterator::slot_index;
          """

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

              path.write_text(text)

          print("BHashTable patch OK")
          PY

      # ==========================================================
      # SIMDE
      # ==========================================================

      - name: Clone SIMDe
        run: |
          set -e

          rm -rf SIMDe

          git clone \
            --depth 1 \
            --branch v0.8.2 \
            https://github.com/simd-everywhere/simde.git \
            SIMDe

          test -f SIMDe/simde/x86/sse.h
          test -f SIMDe/simde/x86/sse2.h

          echo "===== SIMDE ====="

          cd SIMDe
          git describe --tags --always
          cd ..

      # ==========================================================
      # SIMDE XCODE FIX
      # ==========================================================

      - name: Patch SIMDe
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path("SIMDe/simde/x86/sse2.h")
          text = path.read_text()

          start = text.find("simde_mm_cvtpd_ps")

          if start < 0:
              raise SystemExit(
                  "simde_mm_cvtpd_ps not found"
              )

          end = text.find(
              "#if defined(SIMDE_X86_SSE2_ENABLE_NATIVE_ALIASES)",
              start
          )

          if end < 0:
              raise SystemExit(
                  "SIMDe block end not found"
              )

          block = text[start:end]

          broken = (
              "#elif HEDLEY_HAS_BUILTIN("
              "__builtin_shufflevector"
              ") && HEDLEY_HAS_BUILTIN("
              "__builtin_convertvector"
              ")"
          )

          fixed = (
              "#elif 0 "
              "/* iPhone: force scalar fallback */"
          )

          if fixed in block:
              print("SIMDe already patched")

          elif broken in block:
              block = block.replace(
                  broken,
                  fixed,
                  1
              )

              text = (
                  text[:start]
                  + block
                  + text[end:]
              )

              path.write_text(text)

              print("SIMDe patched")

          else:
              raise SystemExit(
                  "SIMDe broken branch not found"
              )
          PY

      # ==========================================================
      # SDL2
      # ==========================================================

      - name: Clone SDL2
        run: |
          set -e

          rm -rf SDL2

          git clone \
            --depth 1 \
            --branch release-2.32.10 \
            https://github.com/libsdl-org/SDL.git \
            SDL2

          test -d SDL2/include
          test -d SDL2/Xcode/SDL

      - name: Build SDL2 for iPhone
        run: |
          set -e
          set -o pipefail

          cd SDL2

          rm -rf sdlbuild

          xcodebuild \
            -project Xcode/SDL/SDL.xcodeproj \
            -target "Static Library-iOS" \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/sdlbuild" \
            build \
            2>&1 | tee sdl-build.log

          SDL_LIB="$(
            find sdlbuild \
              -type f \
              -name 'libSDL2.a' \
              | head -1
          )"

          if [ -z "$SDL_LIB" ]; then
              echo "ERROR: libSDL2.a not found"
              exit 1
          fi

          mkdir -p \
            "$GITHUB_WORKSPACE/Vendor"

          cp \
            "$SDL_LIB" \
            "$GITHUB_WORKSPACE/Vendor/libSDL2.a"

          echo "===== SDL2 ====="

          file \
            "$GITHUB_WORKSPACE/Vendor/libSDL2.a"

      # ==========================================================
      # OPENGL COMPATIBILITY
      # ==========================================================

      - name: Create OpenGL compatibility headers
        run: |
          set -e

          rm -rf IOSCompat

          mkdir -p \
            IOSCompat/GL \
            IOSCompat/KHR

          echo "===== DOWNLOAD glext.h ====="

          curl \
            --fail \
            --location \
            --retry 3 \
            https://raw.githubusercontent.com/KhronosGroup/OpenGL-Registry/main/api/GL/glext.h \
            -o IOSCompat/GL/glext.h

          echo "===== DOWNLOAD khrplatform.h ====="

          curl \
            --fail \
            --location \
            --retry 3 \
            https://raw.githubusercontent.com/KhronosGroup/EGL-Registry/main/api/KHR/khrplatform.h \
            -o IOSCompat/KHR/khrplatform.h

          test -s IOSCompat/GL/glext.h
          test -s IOSCompat/KHR/khrplatform.h

          cat > IOSCompat/IOSGLCompat.h <<'EOF'
          #ifndef BOXEDWINE_IOS_GL_COMPAT_H
          #define BOXEDWINE_IOS_GL_COMPAT_H

          #include <SDL_opengles2.h>

          #ifndef GLdouble
          typedef double GLdouble;
          #endif

          #ifndef GLclampd
          typedef double GLclampd;
          #endif

          #include <GL/glext.h>

          #endif
          EOF

          echo "===== OPENGL FILES ====="

          ls -lh \
            IOSCompat/GL/glext.h \
            IOSCompat/KHR/khrplatform.h \
            IOSCompat/IOSGLCompat.h

      # ==========================================================
      # TEST GL TYPES BEFORE BIG BUILD
      # ==========================================================

      - name: Test OpenGL compatibility
        run: |
          set -e

          cat > /tmp/glcompat-test.cpp <<'EOF'
          #include <IOSGLCompat.h>

          GLdouble a = 0.0;
          GLclampd b = 0.0;
          GLhandleARB c = 0;
          GLcharARB d = 0;
          GLintptrARB e = 0;
          GLsizeiptrARB f = 0;
          GLhalfARB g = 0;
          GLhalfNV h = 0;

          int main() {
              (void)a;
              (void)b;
              (void)c;
              (void)d;
              (void)e;
              (void)f;
              (void)g;
              (void)h;
              return 0;
          }
          EOF

          SDK="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          CXX="$(
            xcrun \
              --sdk iphoneos \
              -f clang++
          )"

          "$CXX" \
            -std=gnu++20 \
            -fsyntax-only \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -IIOSCompat \
            -ISDL2/include \
            /tmp/glcompat-test.cpp

          echo "===== GL COMPAT TEST PASSED ====="

      # ==========================================================
      # PATCH BOXEDWINE OPENGL HEADER
      # ==========================================================

      - name: Patch BoxedWine GL common header
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "Boxedwine/source/opengl/glcommon.h"
          )

          text = path.read_text()

          marker = "#ifdef BOXEDWINE_OPENGL\n"

          patch = """#ifdef BOXEDWINE_OPENGL

          #ifdef BOXEDWINE_IOS_HOST
          #include <IOSGLCompat.h>
          #endif
          """

          if "#include <IOSGLCompat.h>" not in text:
              if marker not in text:
                  raise SystemExit(
                      "BOXEDWINE_OPENGL marker not found"
                  )

              text = text.replace(
                  marker,
                  patch,
                  1
              )

              path.write_text(text)

          print("glcommon.h patched")
          PY

      # ==========================================================
      # SDL OPENGL -> GLES
      # ==========================================================

      - name: Patch SDL OpenGL for iPhone
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "Boxedwine/source/opengl/sdl/sdlgl.cpp"
          )

          text = path.read_text()

          text = text.replace(
              "#ifdef __APPLE__",
              "#if defined(__APPLE__) && TARGET_OS_OSX"
          )

          if "#include <TargetConditionals.h>" not in text:
              marker = '#include "boxedwine.h"\n'

              replacement = """#include "boxedwine.h"

          #if defined(__APPLE__)
          #include <TargetConditionals.h>
          #endif
          """

              if marker not in text:
                  raise SystemExit(
                      "boxedwine.h include not found"
                  )

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          text = text.replace(
              "#include <SDL_opengl.h>",
              "#include <IOSGLCompat.h>"
          )

          reset = "    SDL_GL_ResetAttributes();"

          es_setup = """    SDL_GL_ResetAttributes();

          #ifdef BOXEDWINE_ES
              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_PROFILE_MASK,
                  SDL_GL_CONTEXT_PROFILE_ES
              );

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MAJOR_VERSION,
                  2
              );

              SDL_GL_SetAttribute(
                  SDL_GL_CONTEXT_MINOR_VERSION,
                  0
              );
          #endif"""

          if "SDL_GL_CONTEXT_PROFILE_ES" not in text:
              if reset not in text:
                  raise SystemExit(
                      "SDL_GL_ResetAttributes not found"
                  )

              text = text.replace(
                  reset,
                  es_setup,
                  1
              )

          path.write_text(text)

          print("sdlgl.cpp patched")
          PY

      # ==========================================================
      # DISABLE BOXEDWINE DEFAULT MAIN
      # ==========================================================

      - name: Disable BoxedWine default main
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "Boxedwine/platform/sdl/knativesystem.cpp"
          )

          text = path.read_text()

          old = "#ifndef __TEST"

          new = (
              "#if !defined(__TEST) && "
              "!defined(BOXEDWINE_IOS_HOST)"
          )

          if new in text:
              print("default main already disabled")

          elif old in text:
              text = text.replace(
                  old,
                  new,
                  1
              )

              path.write_text(text)

              print("default main disabled")

          else:
              raise SystemExit(
                  "default main guard not found"
              )
          PY

      # ==========================================================
      # ZLIB / MINIZIP
      # ==========================================================

      - name: Clone zlib
        run: |
          set -e

          rm -rf zlib-src

          git clone \
            --depth 1 \
            https://github.com/madler/zlib.git \
            zlib-src

          mkdir -p \
            Vendor/include/minizip

          cp \
            zlib-src/contrib/minizip/*.h \
            Vendor/include/minizip/

      - name: Build minizip
        run: |
          set -e

          SDK="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          CC="$(
            xcrun \
              --sdk iphoneos \
              -f clang
          )"

          rm -rf minizip-build
          mkdir -p minizip-build

          for SRC in \
            ioapi.c \
            unzip.c \
            zip.c \
            mztools.c
          do

              "$CC" \
                -c \
                -O3 \
                -arch arm64 \
                -isysroot "$SDK" \
                -miphoneos-version-min=15.0 \
                -Izlib-src \
                -Izlib-src/contrib/minizip \
                "zlib-src/contrib/minizip/$SRC" \
                -o \
                "minizip-build/${SRC%.c}.o"

          done

          /usr/bin/libtool \
            -static \
            -o Vendor/libminizip.a \
            minizip-build/*.o

          echo "===== MINIZIP ====="

          file \
            Vendor/libminizip.a

      # ==========================================================
      # IOS LAUNCHER
      # ==========================================================

      - name: Create iPhone launcher
        run: |
          set -e

          mkdir -p IOSHost

          cat > IOSHost/main.mm <<'EOF'
          #import <Foundation/Foundation.h>

          #include <SDL.h>
          #include <sys/stat.h>
          #include <unistd.h>

          #include <string>
          #include <vector>

          extern int boxedmain(
              int argc,
              const char **argv
          );

          static bool exists(
              const std::string& path
          ) {
              struct stat st {};

              return stat(
                  path.c_str(),
                  &st
              ) == 0;
          }

          static void showMessage(
              const char* title,
              const char* text
          ) {
              SDL_Init(
                  SDL_INIT_VIDEO
              );

              SDL_ShowSimpleMessageBox(
                  SDL_MESSAGEBOX_INFORMATION,
                  title,
                  text,
                  nullptr
              );

              SDL_Quit();
          }

          int main(
              int argc,
              char* argv[]
          ) {
              @autoreleasepool {

                  NSArray *paths =
                      NSSearchPathForDirectoriesInDomains(
                          NSDocumentDirectory,
                          NSUserDomainMask,
                          YES
                      );

                  NSString *documents =
                      [paths firstObject];

                  if (!documents) {
                      return 1;
                  }

                  std::string docs(
                      [documents
                          fileSystemRepresentation]
                  );

                  chdir(
                      docs.c_str()
                  );

                  std::string wineZip =
                      docs + "/Wine.zip";

                  if (!exists(wineZip)) {

                      std::vector<std::string>
                          candidates = {

                          docs + "/Wine-5.0.zip",
                          docs + "/Wine-6.0.zip",
                          docs + "/Wine-7.0.zip",
                          docs + "/Wine-9.0.zip",
                          docs + "/Wine-10.0.zip",
                          docs + "/Wine-11.0.zip"
                      };

                      for (
                          const auto& candidate :
                          candidates
                      ) {
                          if (exists(candidate)) {
                              wineZip = candidate;
                              break;
                          }
                      }
                  }

                  const std::string game =
                      docs + "/postal2";

                  const std::string exe =
                      game +
                      "/System/Postal2.exe";

                  if (!exists(wineZip)) {
                      showMessage(
                          "POSTAL 2",
                          "Нужен Wine.zip в папке приложения."
                      );

                      return 0;
                  }

                  if (!exists(exe)) {
                      showMessage(
                          "POSTAL 2",
                          "Положи папку postal2 в Documents приложения."
                      );

                      return 0;
                  }

                  const std::string root =
                      docs + "/root";

                  mkdir(
                      root.c_str(),
                      0755
                  );

                  const char* extensions =
                      "GL_EXT_multi_draw_arrays "
                      "GL_ARB_vertex_program "
                      "GL_ARB_fragment_program "
                      "GL_ARB_multitexture "
                      "GL_EXT_secondary_color "
                      "GL_EXT_texture_lod_bias "
                      "GL_NV_texture_env_combine4 "
                      "GL_ATI_texture_env_combine3 "
                      "GL_EXT_texture_filter_anisotropic "
                      "GL_ARB_texture_env_combine "
                      "GL_EXT_texture_env_combine "
                      "GL_EXT_texture_compression_s3tc "
                      "GL_ARB_texture_compression "
                      "GL_EXT_paletted_texture";

                  std::vector<std::string> values = {

                      "BoxedWine",

                      "-root",
                      root,

                      "-zip",
                      wineZip,

                      "-mount_drive",
                      game,
                      "d",

                      "-fullscreen",

                      "-forceRelativeMouse",

                      "-resolution",
                      "960x540",

                      "-bpp",
                      "32",

                      "-vsync",
                      "1",

                      "-p3",

                      "-glext",
                      extensions,

                      "-title",
                      "POSTAL 2",

                      "/bin/wine",

                      "d:\\System\\Postal2.exe"
                  };

                  std::vector<const char*> args;

                  for (
                      auto& value :
                      values
                  ) {
                      args.push_back(
                          value.c_str()
                      );
                  }

                  return boxedmain(
                      (int)args.size(),
                      args.data()
                  );
              }
          }
          EOF

      # ==========================================================
      # INFO PLIST
      # ==========================================================

      - name: Create Info plist
        run: |
          set -e

          cat > IOSHost/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>CFBundleDisplayName</key>
              <string>POSTAL 2</string>

              <key>CFBundleName</key>
              <string>POSTAL 2</string>

              <key>CFBundleIdentifier</key>
              <string>com.postal2.boxedwine</string>

              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>1.1</string>

              <key>CFBundleVersion</key>
              <string>11</string>

              <key>LSRequiresIPhoneOS</key>
              <true/>

              <key>UIFileSharingEnabled</key>
              <true/>

              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>

              <key>UIRequiresFullScreen</key>
              <true/>

              <key>UISupportedInterfaceOrientations</key>

              <array>

                  <string>
                  UIInterfaceOrientationLandscapeLeft
                  </string>

                  <string>
                  UIInterfaceOrientationLandscapeRight
                  </string>

              </array>

              <key>
              UIApplicationSupportsIndirectInputEvents
              </key>

              <true/>

              <key>UILaunchScreen</key>
              <dict/>

          </dict>

          </plist>
          EOF

      # ==========================================================
      # XCODE PROJECT
      # ==========================================================

      - name: Generate iPhone project
        run: |
          set -e

          cat > project.yml <<'EOF'
          name: Postal2BoxedWine

          options:

            bundleIdPrefix:
              com.postal2

            deploymentTarget:

              iOS:
                "15.0"

          settings:

            base:

              IPHONEOS_DEPLOYMENT_TARGET:
                "15.0"

              CLANG_CXX_LANGUAGE_STANDARD:
                gnu++20

              CLANG_CXX_LIBRARY:
                libc++

              GCC_C_LANGUAGE_STANDARD:
                gnu11

              ENABLE_BITCODE:
                NO

              DEAD_CODE_STRIPPING:
                YES

              ONLY_ACTIVE_ARCH:
                NO

          targets:

            Postal2BoxedWine:

              type:
                application

              platform:
                iOS

              info:

                path:
                  IOSHost/Info.plist

              sources:

                - path:
                    IOSHost

                - path:
                    Boxedwine/source

                  excludes:

                    - "test/**"
                    - "ui/**"
                    - "vulkan/**"
                    - "opengl/osmesa/**"

                - path:
                    Boxedwine/platform/sdl

                  excludes:

                    - "kvulkanSDL.cpp"
                    - "kvulkanSDL.h"

              settings:

                base:

                  PRODUCT_BUNDLE_IDENTIFIER:
                    com.postal2.boxedwine

                  PRODUCT_NAME:
                    POSTAL2

                  TARGETED_DEVICE_FAMILY:
                    "1,2"

                  ARCHS:
                    arm64

                  HEADER_SEARCH_PATHS:

                    - "$(SRCROOT)/IOSCompat"
                    - "$(SRCROOT)/Boxedwine/include"
                    - "$(SRCROOT)/Boxedwine/source"
                    - "$(SRCROOT)/Boxedwine/source/**"
                    - "$(SRCROOT)/Boxedwine/platform/sdl"
                    - "$(SRCROOT)/SDL2/include"
                    - "$(SRCROOT)/Vendor/include"
                    - "$(SRCROOT)/Vendor/include/minizip"
                    - "$(SRCROOT)/SIMDe"

                  LIBRARY_SEARCH_PATHS:

                    - "$(SRCROOT)/Vendor"

                  GCC_PREPROCESSOR_DEFINITIONS:

                    - "$(inherited)"

                    - "BOXEDWINE_64=1"

                    # Do NOT define BOXEDWINE_OPENGL here.
                    # BoxedWine itself defines it.

                    - "BOXEDWINE_OPENGL_SDL=1"
                    - "BOXEDWINE_ES=1"
                    - "BOXEDWINE_ZLIB=1"
                    - "BOXEDWINE_DISABLE_UI=1"
                    - "BOXEDWINE_IOS_HOST=1"

                    - "SIMDE_NO_NATIVE=1"
                    - "SIMDE_NO_VECTOR=1"
                    - "SIMDE_NO_CHECK_IMMEDIATE_CONSTANT=1"

                    - "GLH=<IOSGLCompat.h>"

                  OTHER_CFLAGS:

                    - "$(inherited)"
                    - "-Wno-error"

                  OTHER_CPLUSPLUSFLAGS:

                    - "$(inherited)"
                    - "-std=gnu++20"
                    - "-Wno-error"
                    - "-Wno-deprecated-declarations"
                    - "-Wno-unused-variable"
                    - "-Wno-unused-function"
                    - "-Wno-unused-private-field"
                    - "-Wno-c++11-narrowing"

                  OTHER_LDFLAGS:

                    - "$(inherited)"
                    - "-lSDL2"
                    - "-lminizip"
                    - "-lz"
                    - "-lc++"

              dependencies:

                - sdk:
                    UIKit.framework

                - sdk:
                    Foundation.framework

                - sdk:
                    OpenGLES.framework

                - sdk:
                    QuartzCore.framework

                - sdk:
                    AudioToolbox.framework

                - sdk:
                    AVFoundation.framework

                - sdk:
                    CoreAudio.framework

                - sdk:
                    CoreGraphics.framework

                - sdk:
                    CoreMotion.framework

                - sdk:
                    GameController.framework

                - sdk:
                    CoreHaptics.framework

          EOF

          xcodegen generate

          test -d \
            Postal2BoxedWine.xcodeproj

          echo "===== BUILD SETTINGS ====="

          xcodebuild \
            -project Postal2BoxedWine.xcodeproj \
            -scheme Postal2BoxedWine \
            -showBuildSettings \
            | grep -E \
            "CLANG_CXX_LANGUAGE_STANDARD|GCC_PREPROCESSOR_DEFINITIONS|HEADER_SEARCH_PATHS" \
            || true

      # ==========================================================
      # BUILD
      #
      # IMPORTANT:
      # We DO NOT fail this step immediately.
      # First we save ALL compiler errors.
      # ==========================================================

      - name: Build iPhone BoxedWine
        shell: bash
        run: |
          set +e
          set -o pipefail

          rm -f \
            boxedwine-ios-build.log \
            boxedwine-build-status.txt \
            LAST_ERRORS.txt

          xcodebuild \
            -quiet \
            -project Postal2BoxedWine.xcodeproj \
            -scheme Postal2BoxedWine \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build \
            2>&1 \
            | tee boxedwine-ios-build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" \
            > boxedwine-build-status.txt

          echo
          echo "======================================"
          echo "BUILD STATUS: $STATUS"
          echo "======================================"

          echo
          echo "===== ALL ERROR LINES ====="

          grep -Eni \
            "error:|fatal error:|undefined symbols|duplicate symbol|linker command failed|ld:" \
            boxedwine-ios-build.log \
            || true

          echo
          echo "Build step finished."
          echo "Diagnostic step is next."

          # IMPORTANT:
          # Always return success here so the next step
          # can save the error report.
          exit 0

      # ==========================================================
      # SAVE ALL ERRORS INTO REPOSITORY
      # ==========================================================

      - name: Save ALL compiler errors
        shell: bash
        run: |
          set -e

          STATUS="$(
            cat boxedwine-build-status.txt
          )"

          echo "Compiler status: $STATUS"

          if [ "$STATUS" = "0" ]; then
              echo "Build succeeded. No error report needed."
              exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path

          log = Path(
              "boxedwine-ios-build.log"
          )

          if not log.exists():
              raise SystemExit(
                  "boxedwine-ios-build.log not found"
              )

          lines = log.read_text(
              errors="replace"
          ).splitlines()

          keywords = (
              "error:",
              "fatal error:",
              "undefined symbols",
              "duplicate symbol",
              "linker command failed",
              "ld:",
          )

          errors = []

          for index, line in enumerate(lines):
              low = line.lower()

              if any(
                  keyword in low
                  for keyword in keywords
              ):
                  errors.append(index)

          selected = set()

          for index in errors:

              start = max(
                  0,
                  index - 10
              )

              end = min(
                  len(lines),
                  index + 12
              )

              for n in range(
                  start,
                  end
              ):
                  selected.add(n)

          output = []

          output.append(
              "POSTAL 2 iOS / BOXEDWINE"
          )

          output.append(
              "COMPLETE COMPILER ERROR REPORT"
          )

          output.append(
              "=" * 70
          )

          output.append(
              f"Detected error lines: {len(errors)}"
          )

          output.append("")

          previous = -100

          for index in sorted(selected):

              if index > previous + 1:

                  output.append("")
                  output.append(
                      "-" * 70
                  )
                  output.append("")

              output.append(
                  f"{index + 1}: {lines[index]}"
              )

              previous = index

          output.append("")
          output.append(
              "=" * 70
          )

          output.append(
              "LAST 200 RAW BUILD LINES"
          )

          output.append(
              "=" * 70
          )

          output.append("")

          last = lines[-200:]

          start_number = (
              len(lines)
              - len(last)
              + 1
          )

          for offset, line in enumerate(last):

              number = (
                  start_number
                  + offset
              )

              output.append(
                  f"{number}: {line}"
              )

          Path(
              "LAST_ERRORS.txt"
          ).write_text(
              "\n".join(output)
              + "\n"
          )

          print(
              Path(
                  "LAST_ERRORS.txt"
              ).read_text()
          )
          PY

          echo
          echo "===== SAVING LAST_ERRORS.txt ====="

          git config \
            user.name \
            "postal2-build-bot"

          git config \
            user.email \
            "actions@github.com"

          git add -f \
            LAST_ERRORS.txt

          if git diff \
            --cached \
            --quiet
          then
              echo "LAST_ERRORS.txt did not change."
          else

              git commit \
                -m "Save latest BoxedWine iOS errors"

              git push \
                origin \
                HEAD:main
          fi

          echo
          echo "======================================"
          echo "LAST_ERRORS.txt SAVED"
          echo "======================================"

      # ==========================================================
      # NOW FAIL THE JOB IF COMPILER FAILED
      # ==========================================================

      - name: Check BoxedWine build result
        shell: bash
        run: |
          STATUS="$(
            cat boxedwine-build-status.txt
          )"

          if [ "$STATUS" != "0" ]; then

              echo
              echo "======================================"
              echo "BOXEDWINE BUILD FAILED"
              echo "Errors were saved to LAST_ERRORS.txt"
              echo "======================================"

              exit "$STATUS"

          fi

          echo
          echo "======================================"
          echo "BOXEDWINE BUILD SUCCEEDED"
          echo "======================================"

      # ==========================================================
      # FIND APP
      # ==========================================================

      - name: Find app
        run: |
          set -e

          APP="$(
            find \
              build/Build/Products \
              -type d \
              -name '*.app' \
              -path '*Release-iphoneos*' \
              | head -1
          )"

          if [ -z "$APP" ]; then
              echo "ERROR: app not found"
              exit 1
          fi

          echo "APP=$APP" \
            >> "$GITHUB_ENV"

          echo "===== APP ====="

          echo "$APP"

          du -sh \
            "$APP"

      # ==========================================================
      # CREATE IPA
      # ==========================================================

      - name: Create IPA
        run: |
          set -e

          rm -rf Payload

          mkdir Payload

          cp -R \
            "$APP" \
            Payload/

          /usr/bin/zip \
            -r \
            -9 \
            POSTAL2-BoxedWine-iOS.ipa \
            Payload

          test -f \
            POSTAL2-BoxedWine-iOS.ipa

          echo "===== IPA ====="

          ls -lh \
            POSTAL2-BoxedWine-iOS.ipa

      # ==========================================================
      # RELEASE
      # ==========================================================

      - name: Publish IPA to Releases
        env:

          GH_TOKEN:
            ${{ github.token }}

        run: |
          set -e

          TAG="postal2-ios-${GITHUB_RUN_NUMBER}"

          echo "===== RELEASE ====="
          echo "$TAG"

          gh release create \
            "$TAG" \
            POSTAL2-BoxedWine-iOS.ipa \
            --target "${GITHUB_SHA}" \
            --title "POSTAL 2 iOS Build ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned POSTAL 2 BoxedWine iOS runtime."

          {
              echo
              echo "# ✅ POSTAL 2 IPA READY"
              echo
              echo "Открой Releases."
              echo
              echo "Скачай POSTAL2-BoxedWine-iOS.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
