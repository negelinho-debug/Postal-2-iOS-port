name: POSTAL 2 Windows iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Runtime
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      # ==========================================================
      # REPOSITORY
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== IPHONEOS SDK ====="
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      # ==========================================================
      # TOOLS
      # ==========================================================

      - name: Install tools
        run: |
          set -e

          brew install xcodegen make

          echo "===== XCODEGEN ====="
          xcodegen --version

          echo "===== GNU MAKE ====="
          gmake --version | head -1

      # ==========================================================
      # WINEGLASS
      # Windows PE x86/x86-64 runtime for iOS
      # ==========================================================

      - name: Clone WineGlass
        run: |
          set -e

          rm -rf WineGlass

          git clone \
            --depth 1 \
            https://github.com/Contonion/WineGlass.git \
            WineGlass

          cd WineGlass

          echo "===== WINEGLASS ====="
          git rev-parse HEAD
          ls -la

          test -f project.yml
          test -d Sources
          test -d Vendor/blink
          test -f Vendor/blink/wg_blink_impl.c
          test -f Sources/App/Info.plist

      # ==========================================================
      # BLINK
      # x86 -> ARM64 CPU translation
      # ==========================================================

      - name: Clone Blink
        run: |
          set -e

          rm -rf blink

          git clone \
            --depth 1 \
            https://github.com/jart/blink.git \
            blink

          cd blink

          echo "===== BLINK ====="
          git rev-parse HEAD
          ls -la

          test -f configure

      - name: Configure Blink for iPhone
        run: |
          set -e

          cd blink

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          AR="$(xcrun --sdk iphoneos -f ar)"

          echo "SDK=$SDK"
          echo "CC=$CC"
          echo "AR=$AR"

          if [ -f config.h.ios ]; then
            cp config.h.ios config.h
          fi

          ./configure \
            CC="$CC" \
            AR="$AR" \
            CFLAGS="-g -O2 -arch arm64 -isysroot $SDK -miphoneos-version-min=17.0" \
            --disable-threads \
            --disable-sockets \
            --disable-jit

          echo "===== GENERATED CONFIG ====="

          grep -E \
            "DISABLE_JIT|DISABLE_THREADS|DISABLE_SOCKETS|DISABLE_BMI2" \
            config.h || true

      - name: Build Blink library
        run: |
          set -e

          cd blink

          echo "===== BUILDING BLINK ====="

          gmake \
            -j"$(sysctl -n hw.ncpu)" \
            o//blink/blink.a

          test -f o//blink/blink.a

          echo "===== BLINK LIBRARY ====="
          file o//blink/blink.a
          ls -lh o//blink/blink.a

          mkdir -p \
            "$GITHUB_WORKSPACE/WineGlass/Vendor/blink/lib"

          cp \
            o//blink/blink.a \
            "$GITHUB_WORKSPACE/WineGlass/Vendor/blink/lib/blink.a"

      # ==========================================================
      # WINEGLASS <-> BLINK BRIDGE
      # ==========================================================

      - name: Build WineGlass Blink bridge
        run: |
          set -e

          cd blink

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"

          OUTPUT="$GITHUB_WORKSPACE/WineGlass/Vendor/blink/lib/wg_blink_impl.o"

          mkdir -p \
            "$GITHUB_WORKSPACE/WineGlass/Vendor/blink/lib"

          "$CC" \
            -c \
            -std=c11 \
            -g \
            -O2 \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -D_FILE_OFFSET_BITS=64 \
            -D_DARWIN_C_SOURCE \
            -DTARGET_OS_IPHONE=1 \
            -isystem "$SDK/usr/include" \
            -I. \
            -include config.h \
            "$GITHUB_WORKSPACE/WineGlass/Vendor/blink/wg_blink_impl.c" \
            -o "$OUTPUT"

          test -f "$OUTPUT"

          echo "===== BRIDGE ====="
          file "$OUTPUT"
          ls -lh "$OUTPUT"

          echo "===== FINAL BLINK FILES ====="
          ls -lh \
            "$GITHUB_WORKSPACE/WineGlass/Vendor/blink/lib/"

      # ==========================================================
      # MAKE APP DOCUMENTS VISIBLE IN FILES
      #
      # Later we can place the EXISTING postal2 folder here.
      # This workflow DOES NOT download POSTAL 2 again.
      # ==========================================================

      - name: Enable Files app
        run: |
          set -e

          cd WineGlass

          PLIST="Sources/App/Info.plist"

          test -f "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$PLIST" \
            2>/dev/null \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$PLIST" \
            2>/dev/null \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName POSTAL 2" \
            "$PLIST" \
            2>/dev/null \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string POSTAL 2" \
            "$PLIST"

          echo "===== INFO.PLIST ====="
          plutil -p "$PLIST"

      # ==========================================================
      # GENERATE XCODE PROJECT
      # ==========================================================

      - name: Generate Xcode project
        run: |
          set -e

          cd WineGlass

          xcodegen generate

          test -d WineGlass.xcodeproj

          echo "===== XCODE PROJECT ====="
          ls -la WineGlass.xcodeproj

      # ==========================================================
      # BUILD UNSIGNED IPHONE APP
      # ==========================================================

      - name: Build iPhone app
        run: |
          set -o pipefail

          cd WineGlass

          xcodebuild \
            -project WineGlass.xcodeproj \
            -scheme WineGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.postal2.windows.ios" \
            build \
            2>&1 | tee xcode-build.log

      # ==========================================================
      # ERRORS
      # Does not itself fail when an earlier step failed.
      # ==========================================================

      - name: Show real errors
        if: always()
        run: |
          echo "======================================"
          echo "REAL BUILD ERRORS"
          echo "======================================"

          if [ ! -d WineGlass ]; then
            echo "WineGlass folder does not exist."
            exit 0
          fi

          cd WineGlass

          if [ ! -f xcode-build.log ]; then
            echo "xcode-build.log does not exist."
            exit 0
          fi

          grep -Ei \
            "error:|fatal error:|undefined symbols|ld:|cannot find|no such module|failed|duplicate symbol|architecture" \
            xcode-build.log \
            | tail -250 || true

      # ==========================================================
      # FIND APP
      # ==========================================================

      - name: Find built app
        run: |
          set -e

          cd WineGlass

          APP="$(find \
            build/Build/Products \
            -type d \
            -name "*.app" \
            -path "*Release-iphoneos*" \
            | head -1)"

          if [ -z "$APP" ]; then
            echo "ERROR: Release iPhone .app was not found."
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"

          echo "===== APP ====="
          echo "$APP"

          du -sh "$APP"
          ls -la "$APP"

      # ==========================================================
      # FINAL INFO.PLIST
      # ==========================================================

      - name: Final Info plist
        run: |
          set -e

          cd WineGlass

          PLIST="$APP/Info.plist"

          test -f "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName POSTAL 2" \
            "$PLIST" \
            2>/dev/null \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string POSTAL 2" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$PLIST" \
            2>/dev/null \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$PLIST" \
            2>/dev/null \
          || \
          /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" \
            "$PLIST"

          echo "===== FINAL PLIST ====="
          plutil -p "$PLIST"

      # ==========================================================
      # UNSIGNED IPA
      # ==========================================================

      - name: Create IPA
        run: |
          set -e

          cd WineGlass

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/

          /usr/bin/zip \
            -r \
            -9 \
            POSTAL2-Windows-Runtime.ipa \
            Payload

          test -f POSTAL2-Windows-Runtime.ipa

          echo "===== IPA ====="
          ls -lh POSTAL2-Windows-Runtime.ipa

      # ==========================================================
      # DOWNLOAD
      # ==========================================================

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-Windows-iOS
          path: WineGlass/POSTAL2-Windows-Runtime.ipa
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POSTAL2-Windows-Build-Log
          path: WineGlass/xcode-build.log
          retention-days: 2
          if-no-files-found: ignore
